  function skillsTotal(){
    var released = window.WILDS_SKILLS || [];
    var total = released.reduce(function(s,r){ return s + skillLevel(r[0]); }, 0);
    return { done: total, total: released.length * 99 };
  }
  function questsTotal(){
    var primary = window.WILDS_QUESTS_PRIMARY || [];
    var done = primary.filter(function(p){ return STATE.quests["p:"+p[0]]; }).length;
    var count = primary.length;
    var regions = window.WILDS_QUESTS_SECONDARY || {};
    Object.keys(regions).forEach(function(r){
      regions[r].forEach(function(n){ count++; if (STATE.quests["s:"+n]) done++; });
    });
    return { done: done, total: count };
  }

  // Renders a fixed-column grid of boxes where tapping one opens a detail
  // panel - the panel is inserted after the whole row it belongs to, not
  // right after the box itself, so its row-mate stays put instead of
  // getting bumped down to the row after the panel (which is what a plain
  // per-box insertion into a 2-column CSS grid would do). Shared by Skills,
  // Quest lines, Items/chests and Construction's category and subcategory
  // grids - every fixed `cols`-column tk-grid/tk-subgrid with a tap-to-open
  // box.
  function rowInsert(items, cols, boxFn, isOpenFn, panelFn){
    var html = "";
    for (var i = 0; i < items.length; i += cols){
      var row = items.slice(i, i + cols), openItem = null;
      row.forEach(function(it){
        html += boxFn(it);
        if (isOpenFn(it)) openItem = it;
      });
      if (openItem) html += panelFn(openItem);
    }
    return html;
  }

  // A small box within an already-open Skills/Quests box: one per skill
  // category, or one per quest line. Tapping it expands the actual list.
  function tkSubBox(key, label, stat, sub, pct){
    var open = openSub === key;
    return '<button type="button" class="tk-subbox'+(open?" open":"")+nk("subbox:"+key)+'" data-subbox="'+esc(key)+'">'+
      '<span class="tk-subbox-label">'+esc(label)+'</span>'+
      '<span class="tk-subbox-stat">'+esc(stat)+'</span>'+
      '<span class="tk-subbox-sub">'+esc(sub)+'</span>'+
      '<div class="bar'+(pct>=100?" done":"")+'"><i style="width:'+pct+'%"></i></div>'+
      '</button>';
  }

  // ---------- tracker: skills ----------
  // Flat grid, one small box per skill - no category layer in between. Tap
  // a box to see that skill's description, stepper and level unlocks.
  var SKILL_DESC_OF = {};
  (window.WILDS_SKILLS || []).forEach(function(s){ SKILL_DESC_OF[s[0]] = s[2]; });
  function skillBox(s){
    var name = s[0];
    var lvl = skillLevel(name);
    var open = openSub === "skill:"+name;
    return '<div class="tk-subbox tk-skillbox'+(open?" open":"")+nk("skillbox:"+name)+'">'+
      '<button type="button" class="tk-skillbox-main" data-subbox="skill:'+esc(name)+'">'+
        '<span class="fd-icon">'+skillSvg(name)+'</span>'+
        '<span class="tk-subbox-label">'+esc(name)+'</span>'+
      '</button>'+
      '<div class="tk-skillbox-stp">'+
        '<button type="button" data-d="-1" data-skill="'+esc(name)+'" aria-label="Decrease '+esc(name)+'">−</button>'+
        '<span class="tk-subbox-stat" data-skill-level="'+esc(name)+'">Lv '+lvl+'</span>'+
        '<button type="button" data-d="1" data-skill="'+esc(name)+'" aria-label="Increase '+esc(name)+'">+</button>'+
      '</div>'+
      '</div>';
  }
  function skillDetail(name){
    var lvl = skillLevel(name);
    var desc = SKILL_DESC_OF[name];
    var stepper = '<div class="fdwrap"><div class="fd"><span class="fd-icon">'+skillSvg(name)+'</span>'+
      '<div class="nm">'+esc(name)+'</div>'+
      '<div class="stp"><button type="button" data-d="-1" data-skill="'+esc(name)+'" aria-label="Decrease">−</button><span class="v" data-skill-level="'+esc(name)+'">'+lvl+'</span><button type="button" data-d="1" data-skill="'+esc(name)+'" aria-label="Increase">+</button></div></div></div>';
    return (desc ? '<div class="r"><div class="fv">'+esc(desc)+'</div></div>' : '') + stepper + unlockListWrap(name, lvl);
  }
  function skillsBlock(){
    var released = window.WILDS_SKILLS || [];
    var openName = (openSub && openSub.indexOf("skill:") === 0) ? openSub.slice(6) : null;
    var html = rowInsert(released, 2, skillBox, function(s){ return openName && s[0] === openName; }, function(s){
      return '<div class="tk-subpanel" data-skill-panel="'+esc(s[0])+'"><h4>'+esc(s[0])+'</h4>'+skillDetail(s[0])+'</div>';
    });
    return '<div class="tk-subgrid">'+html+'</div>';
  }
  function updateSkillTotal(){
    var sk = skillsTotal();
    var stat = document.getElementById("boxStatSkills");
    var bar = document.getElementById("boxBarSkills");
    if (stat) stat.textContent = sk.done + " / " + sk.total;
    if (bar){ bar.classList.toggle("done", sk.done >= sk.total); bar.querySelector("i").style.width = Math.round(sk.done / sk.total * 100) + "%"; }
  }

  // ---------- tracker: quests ----------
  function questRow(name, sub, keyPrefix){
    var key = keyPrefix + name;
    var on = !!STATE.quests[key];
    var open = !!openAreas["quest:"+key];
    return '<div class="row'+(on?" on":"")+'" data-qkey="'+esc(key)+'"><div class="box">✓</div><div class="t">'+esc(name)+(sub?'<span class="req">'+esc(sub)+'</span>':'')+'</div>'+
      '<button type="button" class="chevron-btn" data-toggle-quest="'+esc(key)+'" aria-label="Details">›</button></div>'+
      '<div class="quest-detail" data-quest-panel="'+esc(key)+'" '+(open?'':'hidden')+'>'+questWalkthroughHtml(name)+'</div>';
  }
  function questLines(){
    var lines = [{ key:"Primary", list:(window.WILDS_QUESTS_PRIMARY||[]).map(function(p){ return p[0]; }), prefix:"p:" }];
    var regions = window.WILDS_QUESTS_SECONDARY || {};
    Object.keys(regions).forEach(function(r){ lines.push({ key:r, list:regions[r], prefix:"s:" }); });
    return lines;
  }
  function questLineTotal(line){
    var done = line.list.filter(function(n){ return STATE.quests[line.prefix+n]; }).length;
    return { done: done, total: line.list.length };
  }
  function questsBlock(){
    var lines = questLines();
    var html = rowInsert(lines, 2, function(line){
      var t = questLineTotal(line);
      return tkSubBox("questline:"+line.key, line.key, t.done+" / "+t.total, "Quests", Math.round(t.done/t.total*100));
    }, function(line){ return openSub === "questline:"+line.key; }, function(line){
      var rows = line.list.map(function(n){ return questRow(n, "", line.prefix); }).join("");
      return '<div class="tk-subpanel"><h4>'+esc(line.key)+'</h4><div class="area open"><div class="body" style="padding-top:.6rem"><div class="chk">'+rows+'</div></div></div></div>';
    });
    return '<div class="tk-subgrid">'+html+'</div>';
  }

  // ---------- construction (lives under the Catalogue tab) ----------
  // Grouped exactly the way the game's own Build Menu groups it - Category
  // (General, Crafting, Furniture, Decoration, Flooring, Walls, Roofing,
  // Beams and Pillars) -> Subcategory -> an optional material-set group
  // (Cabin/Cottage/Castle/Kharidian, a colour, a faction...) -> items. The
  // group level is what lets you close the styles you don't care about and
  // zero in on, say, just the Castle walls. See fetch_construction_data.py.
  function constructionCatBox(cat){
    var open = openConstructionCat === cat.key;
    var count = cat.subcats.reduce(function(s, sc){
      return s + sc.groups.reduce(function(s2, g){ return s2 + g.items.length; }, 0);
    }, 0);
    var icon = cat.img ? '<img src="'+esc(cat.img)+'" alt="" loading="lazy" class="station-icon">' : '';
    return '<button type="button" class="tk-box'+(open?" open":"")+nk("ccat:"+cat.key)+'" data-ccat="'+esc(cat.key)+'">'+
      '<span class="tk-box-label station-label">'+icon+'<span>'+esc(cat.label)+'</span></span>'+
      '<span class="tk-box-stat">'+count+'</span>'+
      '<span class="tk-box-sub">buildable</span></button>';
  }
  function constructionSubBox(catKey, sub){
    var skey = catKey+"::"+sub.key;
    var open = openConstructionSub === skey;
    var count = sub.groups.reduce(function(s, g){ return s + g.items.length; }, 0);
    var icon = sub.img ? '<img src="'+esc(sub.img)+'" alt="" loading="lazy" class="station-icon">' : '';
    return '<button type="button" class="tk-subbox'+(open?" open":"")+nk("csub:"+skey)+'" data-csub="'+esc(skey)+'">'+
      '<span class="tk-subbox-label station-label">'+icon+'<span>'+esc(sub.label)+'</span></span>'+
      '<span class="tk-subbox-stat">'+count+'</span>'+
      '<span class="tk-subbox-sub">buildable</span></button>';
  }
  // Every card shows its icon, name, Construction XP and full materials up
  // front - no click needed - laid out in a responsive multi-column grid so
  // several sit side by side instead of one per row.
  function constructionItemCardHtml(it, scope){
    var xp = (it.skills || []).map(function(s){ return esc(s.name)+(s.xp ? ' '+esc(String(s.xp))+' XP' : ''); }).join(", ");
    var icon = it.img ? '<img src="'+esc(it.img)+'" alt="" loading="lazy" class="cc-icon">' : '<span class="cc-icon cc-icon-noimg">?</span>';
    return '<div class="cc-card'+nk("ccard:"+scope+"::"+it.name)+'">'+
      '<div class="cc-head">'+icon+'<span class="cc-name">'+esc(it.name)+'</span></div>'+
      (xp ? '<div class="cc-xp">'+xp+'</div>' : '')+
      (it.materials.length ? '<div class="mat-chips">'+it.materials.map(itemChip).join("")+'</div>' : '<div class="recipe-note">No materials needed.</div>')+
      '</div>';
  }
  // A group with no label is the only content in its subcategory (nothing
  // to close), so it renders straight into a card grid; a named group
  // (a material set) gets its own collapsible header, closed by default.
  function constructionGroupSection(catKey, subKey, g){
    var scope = catKey+"::"+subKey+"::"+(g.label || "_");
    var cards = '<div class="construct-grid">'+g.items.map(function(it){ return constructionItemCardHtml(it, scope); }).join("")+'</div>';
    if (!g.label) return cards;
    var open = !!openConstructionGroups[scope];
    var header = '<button type="button" class="tk-subbox'+(open?" open":"")+nk("cgroup:"+scope)+'" data-cgroup="'+esc(scope)+'">'+
      '<span class="tk-subbox-label">'+esc(g.label)+'</span>'+
      '<span class="tk-subbox-stat">'+g.items.length+'</span>'+
      '<span class="tk-subbox-sub">buildable</span></button>';
    return header + (open ? cards : "");
  }
  function constructionTotal(){
    return (window.WILDS_CONSTRUCTION || []).reduce(function(s, cat){
      return s + cat.subcats.reduce(function(s2, sc){
        return s2 + sc.groups.reduce(function(s3, g){ return s3 + g.items.length; }, 0);
      }, 0);
    }, 0);
  }
  // The open category's subcategory grid (and, within it, the open
  // subcategory's own items panel) - broken out so it can be slotted in
  // right after the open category's row, same trick as rowInsert one level up.
  function constructionSubGridHtml(cat){
    var prefix = cat.key+"::";
    var html = rowInsert(cat.subcats, 2, function(sc){ return constructionSubBox(cat.key, sc); },
      function(sc){ return openConstructionSub === prefix+sc.key; },
      function(sc){
        return '<div class="tk-subpanel"><h4>'+esc(sc.label)+'</h4>'+
          sc.groups.map(function(g){ return constructionGroupSection(cat.key, sc.key, g); }).join("")+'</div>';
      });
    return '<div class="tk-subgrid">'+html+'</div>';
  }
  function constructionBlock(){
    var cats = window.WILDS_CONSTRUCTION || [];
    if (!cats.length) return '<div class="note">Not catalogued yet.</div>';
    var html = rowInsert(cats, 2, constructionCatBox, function(c){ return openConstructionCat === c.key; }, function(c){
      return '<div class="tk-cat-expand">'+constructionSubGridHtml(c)+'</div>';
    });
    return '<div class="tk-grid">'+html+'</div>';
  }

  // ---------- tracker: sync + backup ----------
  var ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  function newCode(){
    function part(){ var s=""; for(var i=0;i<4;i++) s += ALPHA[Math.floor(Math.random()*ALPHA.length)]; return s; }
    return "WILDS-"+part()+"-"+part();
  }
  var syncMsg = "";
  function syncPayload(){ return { skills: STATE.skills, quests: STATE.quests }; }
  var syncTimer = null;
  function syncSoon(){
    if (!STATE.code) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncPush(true); }, 1200);
  }
  function syncPush(quiet){
    if (!STATE.code) return;
    fetch("/api/sync?code="+encodeURIComponent(STATE.code), {
      method: "PUT", headers: {"content-type":"application/json"}, body: JSON.stringify(syncPayload())
    }).then(function(r){ return r.json(); }).then(function(r){

    if (!entries) return;
    closeMapOverlay();
    var ov = document.createElement("div");
    ov.className = "map-overlay"; ov.id = "mapOverlay";
    ov.innerHTML = '<div class="map-overlay-bar"><span>'+esc(name)+'</span>'+
      '<button type="button" class="view-tab" data-map-fullmap="'+esc(name)+'">Full map</button>'+
      '<button type="button" class="view-tab" data-map-overlay-close>Close</button></div>'+
      '<div class="map-overlay-map" id="mapOverlayMap"></div>';
    document.body.appendChild(ov);
    document.body.classList.add("map-overlay-open");
    ensureMapLibs().then(function(){
      var el = document.getElementById("mapOverlayMap");
      if (!el) return;
      overlayMap = newWildsMap(el, { center: entries[0].center, zoom: entries[0].zoom });
      var ids = questMapIds(entries);
      ids.forEach(function(id){ showMapCategory(overlayMap, id, true); });
      if (!entries[0].center) fitMapToCategories(overlayMap, ids);
    });
  }
  function closeMapOverlay(){
    if (overlayMap){ overlayMap.remove(); overlayMap = null; }
    var ov = document.getElementById("mapOverlay");
    if (ov) ov.remove();
    document.body.classList.remove("map-overlay-open");
  }
  function gotoByName(name){
    closeMapOverlay();
    view.tab = "tracker"; view.q = name; qInput.value = name; clearBtn.classList.add("on");
    window.scrollTo(0, 0); draw();
    var cards = resultsEl.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++){
      var h = cards[i].querySelector("h2");
      if (h && h.textContent === name){ cards[i].querySelector("button[data-open]").click(); break; }
    }
  }
  document.addEventListener("click", function(e){
    var go = e.target.closest("[data-map-goto]");
    if (go){ gotoByName(go.dataset.mapGoto); return; }
    if (e.target.closest("[data-map-overlay-close]")){ closeMapOverlay(); return; }
    var full = e.target.closest("[data-map-fullmap]");
    if (full){ var en = questMapEntries(full.dataset.mapFullmap); if (en) openFullMapAt(questMapIds(en)); return; }
    var qm = e.target.closest(".q-map-wrap");
    if (qm){ openQuestMapOverlay(qm.dataset.questMapName); return; }
    if (e.target.closest("#mapLayersBtn")){
      var sheet = document.getElementById("mapSheet");
      sheet.hidden = !sheet.hidden;
      if (!sheet.hidden) refreshMapSheet();
      return;
    }
    if (e.target.closest("#mapSheetDone")){ document.getElementById("mapSheet").hidden = true; return; }
    var preset = e.target.closest("[data-map-preset]");
    if (preset){
      var want = preset.dataset.mapPreset === "none" ? [] :
        window.WILDS_MAP.categories.filter(function(c){ return MAP_DEFAULT_GROUPS.indexOf(c.group) !== -1; }).map(function(c){ return c.id; });
      mapVisibleIds().slice().forEach(function(id){ if (want.indexOf(id) === -1) setMapCategory(id, false); });
      want.forEach(function(id){ setMapCategory(id, true); });
      saveState(); refreshMapSheet();
      return;
    }
    // Opening a quest card or panel can reveal a map preview.
    setTimeout(initQuestMaps, 0);
  });
  document.addEventListener("change", function(e){
    var cat = e.target.closest("input[data-map-cat]");
    var grp = e.target.closest("input[data-map-group]");
    if (!cat && !grp) return;
    if (cat){
      setMapCategory(cat.dataset.mapCat, cat.checked);
      var find = document.getElementById("mapFind");
      if (cat.checked && wildsMap && find && find.value.trim()) fitMapToCategories(wildsMap, [cat.dataset.mapCat]);
    } else {
      var f = (document.getElementById("mapFind") || {}).value || "";
      var g = mapGroups().filter(function(x){ return x.name === grp.dataset.mapGroup; })[0];
      g.cats.filter(function(c){ return !f.trim() || c.id.toLowerCase().indexOf(f.trim().toLowerCase()) !== -1 || g.name.toLowerCase().indexOf(f.trim().toLowerCase()) !== -1; })
        .forEach(function(c){ setMapCategory(c.id, grp.checked); });
    }
    saveState(); refreshMapSheet();
  });
  document.addEventListener("input", function(e){
    if (e.target.id === "mapFind") refreshMapSheet();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeMapOverlay();
  });

  function drawSettings(){
    trackerEl.innerHTML = '<div class="tk-head"><h2>Settings</h2></div>'+
      '<div class="tk-panel">'+syncBlock()+backupBlock()+'<button class="tk-reset" id="tkReset">Reset all progress</button></div>';
    var box = document.getElementById("bkBox");
    if (box) box.value = backupJSON();
  }

  trackerEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.id === "videoAddInput"){
      e.preventDefault();
      addVideoChannel(e.target.value.trim());
    }
  });
  trackerEl.addEventListener("change", function(e){
    if (e.target.id === "powerFilterOn"){
      STATE.powerFilterOn = e.target.checked;
      saveState();
      drawStorage();
    }
  });

  trackerEl.addEventListener("click", function(e){
    if (e.target.tagName === "IMG" && e.target.closest(".item-tile-img, .mat-chip, .cc-icon, .station-icon")){
      openIconLightbox(e.target.src, nearbyIconName(e.target));
      return;
    }
    var matLink = e.target.closest("[data-mat-link]");
    if (matLink){
      navToMaterial(matLink.dataset.matLink);
      return;
    }
    var viewBtn = e.target.closest("button[data-view]");
    if (viewBtn){
      storageView = viewBtn.dataset.view;
      openItem = null;
      drawStorage();
      return;
    }
    var catViewBtn = e.target.closest("button[data-catview]");
    if (catViewBtn){
      var cv = catViewBtn.dataset.catview;
      redrawStorageAnchored(catViewBtn, "data-catview", cv, function(){ catalogueView = cv; }, drawStorage);
      return;
    }
    var ccatBtn = e.target.closest("button[data-ccat]");
    if (ccatBtn){
      var ckey2 = ccatBtn.dataset.ccat;
      redrawStorageAnchored(ccatBtn, "data-ccat", ckey2, function(){
        openConstructionCat = (openConstructionCat === ckey2) ? null : ckey2;
        openConstructionSub = null; openConstructionGroups = {};
      }, drawStorage);
      return;
    }
    var csubBtn = e.target.closest("button[data-csub]");
    if (csubBtn){
      var skey2 = csubBtn.dataset.csub;
      redrawStorageAnchored(csubBtn, "data-csub", skey2, function(){
        openConstructionSub = (openConstructionSub === skey2) ? null : skey2;
        openConstructionGroups = {};
      }, drawStorage);
      return;
    }
    var cgroupBtn = e.target.closest("button[data-cgroup]");
    if (cgroupBtn){
      var gkey2 = cgroupBtn.dataset.cgroup;
      redrawStorageAnchored(cgroupBtn, "data-cgroup", gkey2, function(){
        openConstructionGroups[gkey2] = !openConstructionGroups[gkey2];
      }, drawStorage);
      return;
    }
    var chestBtn = e.target.closest("button[data-chest]");
    if (chestBtn){
      var ckey = chestBtn.dataset.chest;
      redrawStorageAnchored(chestBtn, "data-chest", ckey, function(){
        openChest = (openChest === ckey) ? null : ckey;
        openItem = null;
      });
      return;
    }
    var stationBtn = e.target.closest("button[data-station]");
    if (stationBtn){
      var sname = stationBtn.dataset.station;
      redrawStorageAnchored(stationBtn, "data-station", sname, function(){
        selectedStations[sname] = !selectedStations[sname];
        openItem = null;
      });
      return;
    }
    var itemBtn = e.target.closest("button[data-item]");
    if (itemBtn){
      var ikey = itemBtn.dataset.item;
      redrawStorageAnchored(itemBtn, "data-item", ikey, function(){
        openItem = (openItem === ikey) ? null : ikey;
      });
      return;
    }
    var favBtn = e.target.closest("button[data-fav]");
    if (favBtn){
      toggleFavoriteVideo(favBtn.dataset.fav);
      document.querySelectorAll('.video-fav[data-fav="'+CSS.escape(favBtn.dataset.fav)+'"]').forEach(function(el){
        el.classList.toggle("on", isFavoriteVideo(favBtn.dataset.fav));
        el.textContent = isFavoriteVideo(favBtn.dataset.fav) ? "★" : "☆";
      });
      var favWrap = document.getElementById("videoFavRowWrap");
      if (favWrap) favWrap.innerHTML = videoFavRowHtml();
      return;
    }
    var vidBtn = e.target.closest("[data-vid]");
    if (vidBtn){
      selectVideo(vidBtn.dataset.vid);
      return;
    }
    var removeChBtn = e.target.closest("[data-remove-channel]");
    if (removeChBtn){
      removeVideoChannel(removeChBtn.dataset.removeChannel);
      return;
    }
    var chBtn = e.target.closest("[data-channel]");
    if (chBtn){
      STATE.activeVideoChannelId = chBtn.dataset.channel;
      saveState();
      drawVideos();
      refreshVideosIfStale();
      return;
    }
    if (e.target.id === "videoAddBtn"){
      var input = document.getElementById("videoAddInput");
      if (input) addVideoChannel(input.value.trim());
      return;
    }
    var pwrBtn = e.target.closest("button[data-pwr]");
    if (pwrBtn){
      var max = window.WILDS_STORAGE_MAX_STEP || 0;
      var d = parseInt(pwrBtn.dataset.pwr, 10);
      STATE.powerLevel = Math.max(0, Math.min(max, STATE.powerLevel + d));
      saveState();
      drawStorage();
      return;
    }
    var boxBtn = e.target.closest("button[data-box]");
    if (boxBtn){
      var bkey = boxBtn.dataset.box;
      if (openBox === bkey) return; // one of Skills/Quests is always open
      openBox = bkey;
      openSub = null;
      drawTracker();
      return;
    }
    var subBtn = e.target.closest("button[data-subbox]");
    if (subBtn){
      var skey = subBtn.dataset.subbox;
      openSub = (openSub === skey) ? null : skey;
      drawTracker();
      return;
    }
    var stp = e.target.closest("button[data-d]");
    if (stp){
      var name = stp.dataset.skill;
      var d = parseInt(stp.dataset.d, 10);
      applySkillLevel(name, skillLevel(name) + d, stp.parentElement.querySelector("[data-skill-level]"), d > 0 ? "tick-up" : "tick-down");
      return;
    }
    var lvlSpan = e.target.closest("[data-skill-level]");
    if (lvlSpan){
      var skName = lvlSpan.dataset.skillLevel;
      openNumPicker(skName, 1, 99, skillLevel(skName), function(v){
        applySkillLevel(skName, v, null, null);
      });
      return;
    }
    var toggleQuest = e.target.closest("button[data-toggle-quest]");
    if (toggleQuest){
      var qkey = toggleQuest.dataset.toggleQuest;
      var qk = "quest:" + qkey;
      openAreas[qk] = !openAreas[qk];
      var qpanel = document.querySelector('[data-quest-panel="'+qkey+'"]');
      if (qpanel) qpanel.hidden = !openAreas[qk];
      toggleQuest.classList.toggle("open", openAreas[qk]);
      return;
    }
    var qrow = e.target.closest(".row[data-qkey]");
    if (qrow){
      var key = qrow.dataset.qkey;
      if (STATE.quests[key]) delete STATE.quests[key]; else STATE.quests[key] = true;
      saveState(); drawTracker(); return;
    }
    var act = e.target.closest("button[data-act]");
    if (act){
      var a = act.dataset.act;
      if (a === "new"){ STATE.code = newCode(); saveState(); syncMsg=""; syncPush(true); drawSettings(); }
      else if (a === "use"){
        var input = document.getElementById("syIn");
        var v = (input.value||"").toUpperCase().trim();
        if (/^WILDS-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){ STATE.code = v; saveState(); syncPull(); }
        else { syncMsg = "That doesn't look like a WILDS-XXXX-XXXX code."; drawSettings(); }
      }
      else if (a === "forget"){ STATE.code = ""; saveState(); syncMsg=""; drawSettings(); }
      else if (a === "push"){ syncPush(false); }
      else if (a === "pull"){ syncPull(); }
      else if (a === "export"){
        var box = document.getElementById("bkBox");
        box.value = backupJSON();
        var done = function(ok){ bkMsg = ok ? "Copied." : "Select and copy the text above."; bkMsgCls = ok?"ok":""; drawSettings(); };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(box.value).then(function(){done(true)}).catch(function(){
            box.select(); try{ done(document.execCommand("copy")); } catch(e){ done(false); }
          });
        } else {
          box.select(); try{ done(document.execCommand("copy")); } catch(e){ done(false); }
        }
      }
      else if (a === "import"){
        restoreBackup(document.getElementById("bkBox").value);
      }
      return;
    }
    if (e.target.id === "tkReset"){
      if (confirm("Clear all skill levels, quest checks, and your sync code? This can't be undone locally.")){
        STATE = defaultState(); saveState(); drawSettings();
      }
    }
  });

  draw();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
