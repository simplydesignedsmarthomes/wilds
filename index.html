<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15120F">
<title>Wilds - RuneScape: Dragonwilds companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette lifted from the classic RuneScape interface panel: dark oak,
   parchment text, gold accents, hard bevel edges instead of iOS rounding.
   Font is Cinzel (free, Google Fonts) for a similar carved-stone feel to the
   game's own UI font, without using Jagex's actual proprietary typeface. */
:root{
  color-scheme:dark;
  /* Obsidian-dragon base: a cool near-black instead of flat oak-brown, so
     the gold/ember/mystic accents (and item icons) actually pop instead of
     competing with a muddy brown backdrop. */
  --bg:#131118;
  --panel:#211e28;
  --panel2:#282531;
  --panel3:#332f3d;
  --edge-dark:#09080d;
  --edge-light:#4d4860;
  --gold:#ffb000;
  --gold-dim:rgba(255,176,0,.16);
  --text:#efe6d6;
  --text2:#beb2a8;
  --text3:#8f8597;
  --green:#5fbf4f;
  --red:#e2554f;
  /* Dragonwilds accent trio - dragonfire ember, wild emerald, arcane mystic.
     With the cooler obsidian base these now carry most of the "color" in
     the UI instead of being a light garnish on brown. */
  --ember:#ff7347;
  --ember-dim:rgba(255,115,71,.18);
  --emerald:#3ecf8e;
  --mystic:#a78bfa;
  --note-bg:rgba(255,176,0,.12);
  --note-fg:#e8c27a;
  --shadow:0 2px 0 var(--edge-dark), 0 6px 16px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
  --head:'Cinzel',Georgia,'Times New Roman',serif;
  --ui:Georgia,'Times New Roman',serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --r-lg:18px;
  --tb:4.3rem;
}
/* touch-action:manipulation stops rapid taps (e.g. hammering a stepper's
   + button) from being read as a double-tap-to-zoom gesture on mobile
   Safari/Chrome. Pinch-zoom stays available since only double-tap is cut. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
/* touch-action is the intersection of an element's own value and all its
   ancestors', so pinning the root to pan-y blocks horizontal swipe/pan
   (and the browser's edge-swipe back/forward gesture) everywhere, while
   the per-element "manipulation" above still kills the double-tap delay. */
html,body{margin:0;padding:0;touch-action:pan-y}
body{
  background:
    radial-gradient(ellipse at top, rgba(255,176,0,.09), transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(255,115,71,.07), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(167,139,250,.07), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
  overscroll-behavior-y:contain;
}
.wrap{max-width:720px;margin:0 auto;padding:0 1rem;width:100%}

.hero{
  position:sticky;top:0;z-index:15;background:var(--bg);
  padding-top:calc(.6rem + env(safe-area-inset-top));
  padding-bottom:.7rem;flex-shrink:0;
  border-bottom:1px solid var(--edge-dark);
}
.hero-row{display:flex;align-items:center;gap:.5rem}
.hero-row .searchbox{flex:1;min-width:0}
.gear-btn{
  flex-shrink:0;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(122,103,72,.35);
}
.gear-btn svg{width:20px;height:20px}
.gear-btn:active{background:var(--panel3)}
.searchbox{position:relative}
.searchbox input{
  width:100%;background:var(--panel2);border:1px solid var(--edge-dark);
  color:var(--text);font-family:var(--ui);font-size:16px;
  padding:.65rem 2.2rem .65rem .8rem;outline:none;border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(122,103,72,.35);
}
.searchbox input::placeholder{color:var(--text3)}
.searchbox input:focus{box-shadow:0 0 0 2px var(--gold-dim), inset 0 1px 0 rgba(0,0,0,.4)}
.searchbox .clear{
  position:absolute;right:.3rem;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--text3);font-size:1.35rem;line-height:1;
  padding:.35rem .6rem;cursor:pointer;display:none;
}
.searchbox .clear.on{display:block}


main.wrap{flex-shrink:0;padding-bottom:calc(var(--tb) + 2rem + env(safe-area-inset-bottom))}
.sect{display:flex;align-items:baseline;gap:.5rem;margin:.9rem 0 .5rem}
.count{
  font-family:var(--head);font-size:13px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text3);margin:.9rem 0 .5rem;
}
.count:empty{display:none;margin:0}

.card{
  background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);
  margin-bottom:.55rem;overflow:hidden;box-shadow:var(--shadow);
}
.card.open>button{background:var(--panel3)}
.card>button{width:100%;background:none;border:0;color:inherit;text-align:left;padding:.7rem .85rem;cursor:pointer;display:flex;align-items:baseline;gap:.5rem;font-family:inherit}
.card h2{margin:0;font-family:var(--head);font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.card-icon{display:inline-flex;align-self:center;color:var(--gold);flex-shrink:0}
.card-icon svg{width:18px;height:18px;display:block}
.card-icon img{width:20px;height:20px;object-fit:contain;display:block}
.card .sub{margin-left:auto;font-size:12px;color:var(--gold);text-align:right;flex-shrink:0;max-width:45%;font-weight:600}
.tagline{display:inline-block;font-size:10px;font-weight:700;color:var(--bg);background:var(--gold);border-radius:2px;padding:.15rem .4rem;margin-right:.4rem;vertical-align:.1em;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}

/* Regions and Crafting browse as a grid of small tappable boxes, same
   language as the Progress skill grid - tap one and it expands to full
   width right where it was, pushing the rest down until it's closed. */
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.results-grid .card{margin-bottom:0}
.results-grid .card>button{flex-direction:column;align-items:flex-start;gap:.2rem;padding:.65rem .75rem}
.results-grid .card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold)}
.results-grid .card .sub{margin-left:0;text-align:left;max-width:100%;color:var(--text3);font-weight:600}
.results-grid .card.open{grid-column:1 / -1}
.body{padding:.1rem .85rem .85rem;border-top:1px solid var(--edge-dark)}
.rows{padding-top:.15rem}
.r{padding:.5rem 0}
.r.block{border-top:1px solid var(--edge-dark);margin-top:.3rem;padding-top:.6rem}
.fk{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fk.subhead{display:block;margin:.7rem 0 .3rem;color:var(--gold)}
.fk.subhead:first-child{margin-top:0}
.fv{font-size:15px;line-height:1.5;color:var(--text2)}
.wide{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.45rem .6rem;margin:.35rem 0}
.wide .fk{margin-bottom:.15rem}
.steps{margin:.3rem 0 0;padding-left:1.3rem;color:var(--text2);font-size:15px;line-height:1.6}
.steps li{margin-bottom:.4rem}
.steps li::marker{color:var(--gold);font-weight:700}
.q-gallery{display:grid;gap:.6rem;margin-top:.35rem}
.q-fig{margin:0}
.q-fig img{display:block;width:100%;border-radius:var(--r);border:1px solid var(--edge-dark)}
.q-fig figcaption{font-size:13px;color:var(--text3);margin-top:.3rem;line-height:1.4}
.q-places{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;margin-top:.35rem}
.q-place{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);overflow:hidden;min-width:0}
.q-place img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.q-place span{display:block;padding:.35rem .5rem;font-size:13px;color:var(--text2)}
/* interactive map */
.map-toolbar{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 .5rem}
.map-toolbar .view-tab{flex:0 0 auto;padding:.45rem .9rem}
.map-hint{font-size:12px;color:var(--text3)}
.map-full{position:relative;border:1px solid var(--edge-dark);border-radius:var(--r-lg);overflow:hidden;background:#0b0a0f;min-height:320px}
.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;text-align:center;padding:1rem}
.map-tab{position:relative}
.map-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;max-height:72vh;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--edge-light);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom)}
.map-sheet[hidden]{display:none}
.map-sheet-head{display:flex;gap:.5rem;padding:.7rem .8rem .4rem}
.map-sheet-head input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--text);padding:.5rem .7rem;font:inherit;font-size:15px}
.map-sheet-head .view-tab{flex:0 0 auto;padding:.45rem .9rem}
.map-sheet-actions{display:flex;gap:.5rem;padding:0 .8rem .4rem}
.map-sheet-actions button{background:none;border:0;color:var(--gold);font:inherit;font-size:13px;padding:.2rem 0;cursor:pointer}
.map-sheet-body{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:0 .8rem .8rem}
.map-group{border-bottom:1px solid var(--edge-dark)}
.map-group summary{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;cursor:pointer;list-style:none;font-size:14px;color:var(--text)}
.map-group summary::-webkit-details-marker{display:none}
.map-group-name{flex:1;min-width:0}
.map-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid #0e0d12}
.map-count{font-size:12px;color:var(--text3);flex-shrink:0}
.map-cat{display:flex;align-items:center;gap:.5rem;padding:.35rem 0 .35rem 1.6rem;font-size:13px;color:var(--text2);cursor:pointer}
.map-cat span:first-of-type{flex:1;min-width:0;overflow-wrap:anywhere}
.map-group input,.map-cat input{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;margin:0}
/* Leaflet's own stylesheet loads after this one (on demand), so these
   overrides need higher specificity than its single-class rules. */
.leaflet-container.leaflet-container{background:#0b0a0f;font-family:var(--ui)}
.leaflet-container .leaflet-popup-content-wrapper,.leaflet-container .leaflet-popup-tip{background:var(--panel);color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.leaflet-container .leaflet-popup-content{margin:.6rem .8rem}
.leaflet-container a.leaflet-popup-close-button{color:var(--text3)}
.leaflet-container .leaflet-control-attribution{background:rgba(14,13,18,.75);color:var(--text3);font-size:10px}
.leaflet-container .leaflet-control-attribution a{color:var(--text2)}
.leaflet-container .leaflet-bar a,.leaflet-touch .leaflet-container .leaflet-bar a{background:var(--panel2);color:var(--text);border-bottom-color:var(--edge-dark)}
.map-pop{display:flex;flex-direction:column;gap:.2rem;font-size:13px}
.map-pop b{font-family:var(--head);color:var(--gold);font-size:14px}
.map-pop-cat{color:var(--text3);font-size:12px}
.map-pop-desc{color:var(--text2)}
.map-pop-go{margin-top:.35rem;align-self:flex-start;background:var(--panel2);border:1px solid var(--edge-light);border-radius:var(--r);color:var(--gold);font:inherit;font-size:12px;padding:.3rem .6rem;cursor:pointer}
.q-map-wrap{position:relative;margin-top:.35rem;cursor:pointer;border-radius:var(--r);overflow:hidden;border:1px solid var(--edge-dark)}
.q-map{height:220px;position:relative;pointer-events:none;background:#0b0a0f}
.q-map-cta{position:absolute;right:.5rem;bottom:.5rem;z-index:500;background:rgba(14,13,18,.85);color:var(--gold);font-size:12px;font-family:var(--head);font-weight:700;padding:.3rem .6rem;border-radius:999px;border:1px solid var(--edge-light)}
.map-overlay{position:fixed;inset:0;z-index:1300;display:flex;flex-direction:column;background:var(--bg)}
.map-overlay-bar{display:flex;align-items:center;gap:.5rem;padding:calc(.5rem + env(safe-area-inset-top)) .7rem .5rem;border-bottom:1px solid var(--edge-dark)}
.map-overlay-bar span{flex:1;min-width:0;font-family:var(--head);font-weight:700;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-overlay-bar .view-tab{flex:0 0 auto;padding:.4rem .8rem}
.map-overlay-map{flex:1;min-height:0}
body.map-overlay-open{overflow:hidden}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--edge-light);border-radius:999px;padding:.3rem .7rem;font-size:12px;margin:.15rem .3rem .15rem 0;color:var(--text2)}
.pillrow{margin:.3rem 0}
.note{margin-top:.6rem;padding:.6rem .7rem;background:var(--note-bg);border:1px solid rgba(255,176,0,.3);border-radius:var(--r);font-size:13px;color:var(--note-fg)}
.empty{text-align:center;color:var(--text3);padding:2.5rem 1rem;font-size:15px}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:.3rem;font-family:var(--head)}

.tbl{width:100%;border-collapse:collapse;margin:.4rem 0 .2rem;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--edge-dark)}
.tbl th{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tbl td{color:var(--text2)}
.tblwrap{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:.2rem .5rem;margin-bottom:.9rem;overflow-x:auto}

/* Interface tab row, RuneScape-style - pinned so it's always reachable,
   with a comfortably tall touch target and extra clearance under it (not
   just the bare safe-area inset) so it doesn't sit flush against the
   phone OS's bottom edge-gesture strip. Three tabs, evenly filling the
   width like a normal bottom nav bar - no more horizontal scrolling. */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;min-height:var(--tb);flex-shrink:0;
  background:var(--panel);border-top:1px solid var(--edge-light);
  box-shadow:0 -2px 10px rgba(0,0,0,.4);
  padding:.55rem 0 calc(env(safe-area-inset-bottom) + .55rem);
}
.tabbar button{
  flex:1 1 0;background:none;border:0;border-top:2px solid transparent;
  color:var(--text3);font-family:var(--head);font-size:8.7px;font-weight:600;
  letter-spacing:0;text-transform:uppercase;white-space:nowrap;cursor:pointer;overflow:hidden;
  padding:.35rem .05rem;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.12rem;
}
.tabbar button svg{width:14px;height:14px;flex-shrink:0}
.tabbar button.on{color:var(--gold);border-top-color:var(--gold);border-image:linear-gradient(90deg,var(--ember),var(--gold)) 1}
.tabbar button:active{background:var(--panel3)}

/* checklist rows: quests, bestiary sightings */
.chk{margin-top:.2rem}
.chk .row{display:flex;align-items:flex-start;gap:.6rem;padding:.5rem .1rem;cursor:pointer;border-bottom:1px solid var(--edge-dark)}
.chk .row:last-child{border-bottom:0}
.chk .box{
  flex-shrink:0;width:20px;height:20px;border-radius:2px;margin-top:1px;
  background:var(--panel2);border:1px solid var(--edge-light);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:transparent;
}
.chk .row.on .box{background:var(--green);border-color:var(--green);color:#0e1a0d}
.chk .t{font-size:14px;line-height:1.4;color:var(--text2)}
.chk .row.on .t{color:var(--text3);text-decoration:line-through}
.chk .t .req{display:block;font-size:12px;color:var(--text3);margin-top:.1rem}
.chk .row.on .t .req{color:var(--text3)}
@keyframes boxPop{0%{transform:scale(.7)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.chk .row.pop .box{animation:boxPop .3s cubic-bezier(.2,.9,.3,1) 1}

/* region / group cards inside the tracker: header + progress + checklist body */
.area{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);margin-bottom:.5rem;overflow:hidden;box-shadow:var(--shadow)}
.area>button{width:100%;background:none;border:0;color:inherit;text-align:left;padding:.7rem .8rem;cursor:pointer;font-family:inherit}
.area .hd{display:flex;align-items:baseline;gap:.5rem}
.area .hd b{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text)}
.area .hd span{margin-left:auto;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums}
.area.full .hd span{color:var(--green);font-weight:700}
.area .body{padding:.2rem .8rem .6rem}

/* skill rows with a stepper for level */
.fd{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-bottom:1px solid var(--edge-dark)}
.fd:last-child{border-bottom:0}
.fd-icon{display:flex;flex-shrink:0;align-items:center;justify-content:center;color:var(--gold)}
.fd-icon svg{width:19px;height:19px}
.fd-icon img{width:22px;height:22px;object-fit:contain}
.fd .nm{font-family:var(--head);font-size:14px;line-height:1.2;flex:1;min-width:0;color:var(--text)}
.fd .nm .cat{display:block;font-family:var(--ui);font-size:11px;color:var(--text3);margin-top:2px;text-transform:none}
.fd .stp{margin-left:auto;display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.fd .stp button{width:28px;height:28px;border:1px solid var(--edge-dark);background:var(--panel2);color:var(--gold);border-radius:var(--r);font-size:16px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.fd .stp button:active{background:var(--gold);color:var(--bg)}
.fd .stp .v{min-width:34px;text-align:center;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--head);display:inline-block}
[data-skill-level]{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--edge-light);text-underline-offset:3px}
@keyframes tickUp{0%{transform:scale(1.55)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes tickDown{0%{transform:scale(1.35);color:var(--red)}55%{transform:scale(1.1);color:var(--red)}100%{transform:scale(1)}}
.tick-up{animation:tickUp .3s cubic-bezier(.2,.9,.3,1) 1}
.tick-down{animation:tickDown .28s cubic-bezier(.2,.9,.3,1) 1}
/* Settles new content in with a tiny spring wobble (scale + a couple degrees
   of rotation overshoot) plus a brief ember/gold glow pulse along the edge -
   the same accent color the tier-ember styling uses elsewhere, so it reads
   as this app's own signature rather than a generic web fade. The glow is a
   second, un-filled animation stacked in the same `animation` shorthand: it
   has no 100% fill-mode of its own, so the moment it finishes, box-shadow
   falls back to whatever that element's own CSS already says (its normal
   resting shadow, or a tier-ember ring) instead of getting stuck mid-glow.
   Opt-in via .pop-in, added in JS only to elements that weren't already on
   screen a moment ago (see nk() / curVisibleKeys), so opening a subcategory
   bounces in just the newly-revealed subcategory boxes, not the whole
   page's worth of stuff that was already sitting there.
   New content below the fold starts as .pop-pending (invisible) instead,
   and only turns into .pop-in - and actually plays - once activateReveals()
   sees it scroll into view, so the effect isn't wasted off-screen.
   Skipped entirely for anyone who's asked their OS for reduced motion
   (.pop-pending stays fully visible for them, since nothing will ever
   promote it with an animation). */
.pop-pending{opacity:1}
@media (prefers-reduced-motion: no-preference){
  @keyframes popIn{
    0%{opacity:0;transform:scale(.9) translateY(10px) rotate(-1.4deg)}
    45%{opacity:1;transform:scale(1.035) translateY(-2px) rotate(1deg)}
    70%{transform:scale(.985) translateY(1px) rotate(-.4deg)}
    100%{opacity:1;transform:scale(1) translateY(0) rotate(0deg)}
  }
  @keyframes emberGlow{
    0%{box-shadow:0 0 0 0 rgba(255,176,0,0)}
    40%{box-shadow:0 0 16px 3px rgba(255,176,0,.5)}
    100%{box-shadow:0 0 0 0 rgba(255,176,0,0)}
  }
  .pop-pending{opacity:0}
  .pop-in{animation:popIn .32s cubic-bezier(.22,1,.36,1) both, emberGlow .4s ease-out}
  .tk-grid>*.pop-in:nth-child(1),.tk-subgrid>*.pop-in:nth-child(1),.item-grid>*.pop-in:nth-child(1),.construct-grid>*.pop-in:nth-child(1){animation-delay:0ms}
  .tk-grid>*.pop-in:nth-child(2),.tk-subgrid>*.pop-in:nth-child(2),.item-grid>*.pop-in:nth-child(2),.construct-grid>*.pop-in:nth-child(2){animation-delay:20ms}
  .tk-grid>*.pop-in:nth-child(3),.tk-subgrid>*.pop-in:nth-child(3),.item-grid>*.pop-in:nth-child(3),.construct-grid>*.pop-in:nth-child(3){animation-delay:40ms}
  .tk-grid>*.pop-in:nth-child(4),.tk-subgrid>*.pop-in:nth-child(4),.item-grid>*.pop-in:nth-child(4),.construct-grid>*.pop-in:nth-child(4){animation-delay:60ms}
  .tk-grid>*.pop-in:nth-child(5),.tk-subgrid>*.pop-in:nth-child(5),.item-grid>*.pop-in:nth-child(5),.construct-grid>*.pop-in:nth-child(5){animation-delay:80ms}
  .tk-grid>*.pop-in:nth-child(6),.tk-subgrid>*.pop-in:nth-child(6),.item-grid>*.pop-in:nth-child(6),.construct-grid>*.pop-in:nth-child(6){animation-delay:100ms}
  .tk-grid>*.pop-in:nth-child(7),.tk-subgrid>*.pop-in:nth-child(7),.item-grid>*.pop-in:nth-child(7),.construct-grid>*.pop-in:nth-child(7){animation-delay:120ms}
  .tk-grid>*.pop-in:nth-child(8),.tk-subgrid>*.pop-in:nth-child(8),.item-grid>*.pop-in:nth-child(8),.construct-grid>*.pop-in:nth-child(8){animation-delay:140ms}
  .tk-grid>*.pop-in:nth-child(n+9),.tk-subgrid>*.pop-in:nth-child(n+9),.item-grid>*.pop-in:nth-child(n+9),.construct-grid>*.pop-in:nth-child(n+9){animation-delay:160ms}
}
.fd-name{display:flex;align-items:center;gap:.5rem;flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.chevron-btn{margin-left:auto;flex-shrink:0;background:none;border:0;color:var(--text3);font-size:20px;line-height:1;cursor:pointer;padding:.2rem .3rem;transition:transform .15s ease}
.chevron-btn.open{transform:rotate(90deg);color:var(--gold)}
.quest-detail{padding:.5rem .8rem .7rem 2.7rem;border-bottom:1px solid var(--edge-dark);background:var(--panel2)}
.quest-detail:last-child{border-bottom:0}
.quest-detail .chk .row{padding:.35rem 0}
.quest-detail .note{margin:0}
.fdwrap{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:.9rem;overflow:hidden}

.tk-head{margin:1rem 0 .4rem}
.tk-head h2{font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:.01em;margin:0 0 .5rem;color:var(--gold);text-shadow:0 0 16px rgba(255,176,0,.3)}
.tk-head-note{margin:-.3rem 0 .8rem;font-size:13px;color:var(--text3)}
.video-embed{position:relative;width:100%;padding-top:56.25%;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;margin-top:.8rem}
.video-thumb{position:relative;padding:0;border:2px solid var(--edge-dark);border-radius:var(--r);overflow:hidden;background:var(--panel);cursor:pointer;aspect-ratio:16/9}
.video-thumb img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.video-thumb.active{border-color:var(--gold)}
.video-fav{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,9,13,.65);color:var(--text3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.video-fav.on{color:var(--gold)}
.video-fav-row{margin-top:.6rem}
.video-fav-row-label{font-family:var(--head);color:var(--gold);font-size:13px;font-weight:700;margin-bottom:.4rem}
.video-more-note{text-align:center;color:var(--text3);font-size:13px;padding:.8rem 0}
.video-channel-link{display:block;text-align:center;margin-top:.8rem;padding:.65rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);font-family:var(--head);font-size:13px;font-weight:700;text-decoration:none}
.video-channels-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.4rem}
.video-channel-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:999px;font-family:var(--head);font-size:12.5px;font-weight:700;color:var(--text3);cursor:pointer}
.video-channel-chip.on{color:var(--gold);border-color:var(--gold)}
.video-channel-remove{background:none;border:0;color:inherit;opacity:.6;font-size:15px;line-height:1;padding:0 0 0 .1rem;cursor:pointer}
.video-channel-remove:active{opacity:1}
.video-add-channel{display:inline-flex;gap:.4rem;flex:1 1 220px;min-width:220px}
.video-add-channel input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--edge-dark);border-radius:999px;padding:.4rem .8rem;color:var(--text);font-size:12.5px}
.video-add-channel button{background:var(--panel);border:1px solid var(--edge-dark);border-radius:999px;padding:.4rem .9rem;color:var(--gold);font-family:var(--head);font-size:12.5px;font-weight:700;cursor:pointer}
.video-add-channel button:active{background:var(--panel3)}
.video-add-status{font-size:12px;color:var(--text3);min-height:1.2em;margin:.2rem 0 .6rem}
.video-channel-link:active{background:var(--panel3)}
.update-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-bottom:1rem;box-shadow:var(--shadow);aspect-ratio:16/8;background:var(--panel)}
.update-hero img{width:100%;height:100%;object-fit:cover;display:block}
.update-hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,5,.1) 35%,rgba(10,7,5,.95) 100%)}
.update-hero-text{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.1rem}
.update-hero-text h2{margin:0;font-family:var(--head);font-size:26px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.update-hero-text p{margin:.3rem 0 0;font-size:12.5px;color:var(--text2);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.update-card{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:.8rem}
.update-media{position:relative;display:block;aspect-ratio:16/9;background:var(--panel3);overflow:hidden}
.update-media img{width:100%;height:100%;object-fit:cover;display:block}
.update-media.yt::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.update-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.update-play svg{width:50px;height:50px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.65))}
.update-card-body{padding:.85rem}
.update-meta{display:flex;gap:.5rem;align-items:center;font-size:11.5px;color:var(--text3);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.03em;font-family:var(--head);font-weight:700}
.update-cat{color:var(--gold)}
.update-card h3{font-family:var(--head);font-size:16px;font-weight:700;margin:0 0 .4rem;color:var(--text)}
.update-card h3 a{color:inherit;text-decoration:none}
.update-card h3 a:active{color:var(--gold)}
.update-summary{font-size:13px;color:var(--text2);line-height:1.5;margin:0 0 .65rem}
.power-ctl{display:flex;align-items:center;flex-wrap:wrap;gap:.7rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.6rem .75rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.power-toggle{display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--text2);cursor:pointer}
.power-toggle input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.power-stp{display:flex;align-items:center;gap:.5rem;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.power-stp button{width:24px;height:24px;border:1px solid var(--edge-dark);background:var(--panel2);color:var(--gold);border-radius:var(--r);font-size:14px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.power-stp button:active{background:var(--gold);color:var(--bg)}
.bar{height:8px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:2px;overflow:hidden;margin-top:.45rem}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.bar.done i{background:var(--green)}
.tk-goal{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.65rem .8rem;margin-bottom:.45rem;box-shadow:var(--shadow)}
.tk-goal .t{display:flex;align-items:baseline;gap:.5rem;font-size:15px}
.tk-goal .t b{font-family:var(--head);font-weight:600;color:var(--text)}
.tk-goal .t span{margin-left:auto;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums}
.tk-goal.hit .t span{color:var(--green);font-weight:700}

.tk-section{margin-top:1.6rem}
.tk-section h3{font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:.01em;margin:0 0 .5rem;color:var(--gold)}

/* Progress home: a grid of tappable summary boxes instead of one long
   stacked page - tap a box to reveal its full list below the grid. */
.tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.tk-box{
  display:flex;flex-direction:column;gap:.15rem;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:.85rem;color:inherit;font-family:inherit;
}
.tk-box.open{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tk-box:active{background:var(--panel3)}
.tk-box-label{font-family:var(--head);font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.tk-box-stat{font-family:var(--head);font-size:21px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.tk-box-sub{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-box .bar{margin-top:.3rem}
.tk-panel h3{font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.01em;margin:0 0 .6rem;color:var(--gold)}
.tk-panel .tk-section:first-child{margin-top:0}

/* second drill-down level: skill categories inside the Skills box, quest
   lines inside the Quests box */
/* Indented a level below .tk-box's own grid: a muted left bar plus a
   "Category subcategories" label (set where this grid is rendered) make
   it read as nested, not just a smaller sibling card. */
.tk-subgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
/* One step lighter than .tk-box's panel - a plain tonal shift is the only
   cue that these sit a level in, rather than a line/label calling it out
   (misleading on Skills, where Attack etc. aren't really "subcategories"). */
.tk-subbox{
  display:flex;flex-direction:column;gap:.1rem;text-align:left;cursor:pointer;
  background:var(--panel3);border:1px solid var(--edge-dark);border-radius:var(--r);
  padding:.6rem .7rem;color:inherit;font-family:inherit;
}
.tk-subbox.open{border-color:var(--gold)}
.tk-subbox:active{background:var(--edge-light)}
.tk-subbox-label{font-family:var(--head);font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.station-label{display:flex;align-items:center;gap:.4rem}
.station-icon{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.item-tile-img img,.mat-chip img,.cc-icon,.station-icon{cursor:zoom-in}
.icon-lightbox{position:fixed;inset:0;z-index:90;background:rgba(5,4,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;cursor:zoom-out}
.icon-lightbox img{max-width:min(70vw,320px);max-height:50vh;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.icon-lightbox-caption{font-family:var(--head);font-size:16px;font-weight:700;color:var(--gold);text-align:center}
/* Rotary number picker - tap a level to open it, scroll/drag to the value
   you want, same spirit as an iOS wheel picker. No typing, no 98 taps. */
.num-picker{position:fixed;inset:0;z-index:95;background:rgba(5,4,8,.75);display:flex;align-items:flex-end;justify-content:center}
.num-picker[hidden]{display:none}
.num-picker-sheet{width:100%;max-width:480px;background:var(--panel);border-top:1px solid var(--edge-light);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:1.1rem 1rem calc(env(safe-area-inset-bottom) + 1.1rem);display:flex;flex-direction:column;align-items:center;gap:.9rem}
.num-picker-title{font-family:var(--head);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.num-picker-wheel-wrap{position:relative;width:150px;height:210px;overflow:hidden}
.num-picker-highlight{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:42px;background:var(--panel2);border-top:1px solid var(--edge-light);border-bottom:1px solid var(--edge-light);pointer-events:none;border-radius:var(--r);z-index:1}
.num-picker-wheel{position:relative;z-index:2;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.num-picker-wheel-row{height:42px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--head);font-size:19px;font-weight:700;color:var(--text3);transition:color .15s;cursor:pointer}
.num-picker-wheel-row.sel{color:var(--gold);font-size:25px}
.num-picker-wheel-wrap.num-picker-wheel-as-input{width:100px;height:auto;overflow:visible}
.num-picker-wheel-wrap.num-picker-wheel-as-input .num-picker-highlight{display:none}
.num-picker-input{width:100%;background:var(--panel2);border:1px solid var(--edge-light);border-radius:var(--r);padding:.5rem;text-align:center;font-family:var(--head);font-size:28px;font-weight:700;color:var(--gold);-moz-appearance:textfield}
.num-picker-input::-webkit-outer-spin-button,.num-picker-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-picker-done{background:var(--gold);color:var(--bg);border:0;border-radius:999px;padding:.6rem 2.2rem;font-family:var(--head);font-size:14px;font-weight:700;cursor:pointer}
.num-picker-done:active{opacity:.85}
.tk-subbox-stat{font-family:var(--head);font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.tk-subbox-sub{font-size:11px;color:var(--text3)}
.tk-subbox .bar{margin-top:.25rem;height:5px}
.tk-subpanel{margin-top:.75rem;background:var(--panel2);border:1px solid var(--edge-dark);border-left:3px solid var(--gold);border-radius:var(--r);padding:.75rem .8rem;box-shadow:var(--shadow)}
.tk-subpanel h4{font-family:var(--head);font-size:15px;font-weight:700;color:var(--gold);margin:0 0 .5rem}
/* skill box: tap the icon/name to expand, but the stepper works right
   there without opening anything */
.tk-skillbox{cursor:default}
.tk-skillbox-main{display:flex;align-items:center;gap:.5rem;width:100%;background:none;border:0;margin:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tk-skillbox-stp{display:flex;align-items:center;gap:.4rem;margin-top:.35rem}
.tk-skillbox-stp button{width:26px;height:26px;flex-shrink:0;border:1px solid var(--edge-dark);background:var(--panel);color:var(--gold);border-radius:var(--r);font-size:15px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.tk-skillbox-stp button:active{background:var(--gold);color:var(--bg)}
/* An open box's detail spans the full grid width, right after the row it's
   in - its row-mate stays put beside it rather than dropping to the row
   after the panel (see rowInsert()). */
.tk-subgrid > .tk-subpanel{grid-column:1 / -1;margin-top:0}
.tk-grid > .tk-cat-expand{grid-column:1 / -1}

/* Items/Storage: a chest's contents as a small icon grid, images hotlinked
   straight from the wiki */
/* No max-height/overflow here on purpose: a nested scroll container gets
   its own touch-action scope (so the page-level pan-y lock can't stop
   sideways swiping inside it) and its scroll position resets on every
   redraw. One page-level scroll surface avoids both. dense packing lets
   tiles after an opened detail backfill the row, so the detail lands
   cleanly below the clicked tile's row instead of leaving gaps. */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-auto-flow:row dense;gap:.5rem}
.construct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem;margin-top:.5rem}
.cc-card{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.6rem .7rem}
.cc-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.cc-icon{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.cc-icon-noimg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--panel3);border-radius:6px;font-size:12px;color:var(--text3);flex-shrink:0}
.cc-name{font-family:var(--head);font-weight:700;font-size:13.5px;color:var(--gold);line-height:1.25}
.cc-xp{font-size:11px;color:var(--text3);margin-bottom:.4rem}
.item-tile{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.4rem .3rem;text-align:center;width:100%;color:inherit;font-family:inherit;cursor:pointer}
.item-tile.open{border-color:var(--gold)}
.item-tile:active{background:var(--panel3)}
.item-tile-img{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:.3rem;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.015) 70%);border-radius:8px}
.item-tile-img img{max-width:34px;max-height:34px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.item-tile-noimg{color:var(--text3);font-size:11px}
.item-tile-name{font-size:10.5px;line-height:1.25;color:var(--text2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item-tile-tier{margin-top:.2rem;font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.02em}
.item-tile-tier.tier-ember{color:var(--ember)}
.item-tile-tier.tier-mystic{color:var(--mystic)}
.item-tile-tier.tier-teal{color:#2dd4bf}
.item-tile:has(.tier-ember){box-shadow:0 0 0 1px var(--ember-dim)}
.item-tile:has(.tier-mystic){box-shadow:0 0 0 1px rgba(155,127,232,.18)}
.item-grid > .item-detail{grid-column:1 / -1;min-width:0;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.7rem .85rem;box-shadow:var(--shadow)}
.item-detail h5{margin:0 0 .4rem;font-family:var(--head);font-size:15px;font-weight:700;color:var(--text)}
.item-detail-desc{white-space:pre-wrap}
/* Stats laid out two-up so you can scan them at a glance instead of one
   long single-column list - the "split screen" view. */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.3rem}
.stat-chip{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.4rem .55rem}
.stat-chip .fk{display:block;font-size:10px}
.stat-chip .fv{font-size:13px;color:var(--text)}
.mat-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem}
.mat-chip{display:flex;align-items:center;gap:.35rem;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:999px;padding:.2rem .6rem .2rem .25rem;cursor:pointer}
.mat-chip:active{background:var(--panel3)}
.nav-back-btn{position:fixed;left:.9rem;bottom:calc(var(--tb) + env(safe-area-inset-bottom) + .8rem);z-index:40;background:var(--panel);border:1px solid var(--edge-light);border-radius:999px;padding:.55rem 1.1rem .55rem .9rem;color:var(--gold);font-family:var(--head);font-size:13px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.nav-back-btn[hidden]{display:none}
.nav-back-btn:active{background:var(--panel3)}
.mat-chip img{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.mat-chip-text{font-size:12px;color:var(--text2)}
.mat-chip-text b{color:var(--gold)}
.mat-chip-noimg{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text3);font-size:11px}
.recipe-card{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.5rem .6rem;margin-top:.4rem}
.recipe-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.2rem .6rem}
.recipe-station{font-family:var(--head);font-weight:700;font-size:13px;color:var(--gold)}
.recipe-xp{font-size:12px;color:var(--text3)}
.recipe-note{font-size:12px;color:var(--text3);margin-top:.35rem}
.info-list{display:grid;gap:.3rem;margin-top:.3rem}
.info-row{display:flex;justify-content:space-between;gap:.6rem;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.35rem .6rem;font-size:13px;color:var(--text2)}
.info-row-stack{flex-direction:column;gap:.15rem}
.info-meta{color:var(--text3);font-size:12px;text-align:right;flex-shrink:0}
.info-row-stack .info-meta{text-align:left}
.item-examine{font-style:italic;color:var(--text2);margin-bottom:.4rem}

.view-tabs{display:flex;gap:.5rem;margin-bottom:.6rem}
.view-tab{flex:1;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.5rem;color:var(--text3);font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.view-tab.on{color:var(--gold);border-color:var(--gold)}

.sy{text-align:center;margin-bottom:.2rem}
.sy b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.03em;color:var(--gold);padding:.5rem 0;word-break:break-all}
#syIn{width:100%;margin-top:.6rem;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:16px;padding:.6rem;text-align:center;letter-spacing:.03em}
.bk{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.bk button{flex:1;min-width:88px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);font-family:var(--ui);font-size:14px;font-weight:600;padding:.55rem .5rem;cursor:pointer}
.bk button:active{opacity:.6}
#bkBox{width:100%;margin-top:.6rem;min-height:88px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:12px;padding:.5rem;resize:vertical}
#bkMsg{margin-top:.5rem;font-size:13px;color:var(--text2)}
#bkMsg.ok{color:var(--green)}
#bkMsg.bad{color:var(--red)}
.tk-reset{margin-top:1.2rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--red);font-family:var(--head);font-size:15px;font-weight:600;padding:.75rem 1rem;cursor:pointer;width:100%;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

@keyframes bodyIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.body.in{animation:bodyIn .18s ease-out 1}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
#results .card{animation:cardIn .16s ease-out 1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .card>button{flex-direction:column;align-items:flex-start;gap:.15rem}
  .card .sub{margin-left:0;text-align:left;max-width:100%}
}

<body>

<section class="hero" id="hero">
  <div class="wrap hero-row">
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Search skills, quests, items…" aria-label="Search">
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </div>
    <button class="gear-btn" id="gearBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-dasharray="2.1 2.55" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</section>

<main class="wrap">
  <div id="tracker" hidden></div>
  <div class="count" id="count"></div>
  <div id="results"></div>
</main>

<nav class="tabbar" id="tabbar"></nav>

<div class="icon-lightbox" id="iconLightbox" hidden>
  <img id="iconLightboxImg" src="" alt="">
  <div class="icon-lightbox-caption" id="iconLightboxCaption"></div>
</div>

<div class="num-picker" id="numPicker" hidden>
  <div class="num-picker-sheet">
    <div class="num-picker-title" id="numPickerTitle"></div>
    <div class="num-picker-wheel-wrap">
      <div class="num-picker-highlight"></div>
      <div class="num-picker-wheel" id="numPickerWheel"></div>
    </div>
    <button type="button" class="num-picker-done" id="numPickerDone">Done</button>
  </div>
</div>

<button type="button" class="nav-back-btn" id="navBackBtn" hidden>&#8249; Back</button>

<script src="skills.js"></script>
<script src="level-unlocks.js" onerror="this.remove()"></script>
<script src="quests.js"></script>
<script src="quest-walkthroughs.js" onerror="this.remove()"></script>
<script src="quest-maps.js" onerror="this.remove()"></script>
<script src="updates.js" onerror="this.remove()"></script>
<script src="construction.js" onerror="this.remove()"></script>
<script src="storage.js"></script>
<script>
(function(){

  var TABS = [
    {key:"tracker", label:"Progress"},
    {key:"storage", label:"Catalogue"},
    {key:"map", label:"Map"},
    {key:"videos", label:"Videos"},
    {key:"updates", label:"Updates"}
  ];
  var TAB_LABEL = {}; TABS.forEach(function(t){ TAB_LABEL[t.key] = t.label; });

  // Original line-art icons (not the game's own assets) paired with the
  // word labels in the tab bar.
  var ICONS = {
    storage: '<rect x="4" y="9" width="16" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 9 6 4h12l2 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    tracker: '<path d="M5 19V10M11 19V5M17 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    videos: '<rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/>',
    map: '<path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.6"/>',
    updates: '<path d="M12 4a1.4 1.4 0 0 1 1.4 1.4v.5c2.1.8 3.5 2.8 3.5 5.1v3l1.6 2.3H5.5L7.1 14v-3c0-2.3 1.4-4.3 3.5-5.1v-.5A1.4 1.4 0 0 1 12 4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
  };

  // Only the game's own wiki icon for each skill - no hand-drawn stand-ins.
  function skillSvg(name){
    var url = (window.WILDS_SKILL_ICONS || {})[name];
    return url ? '<img src="'+esc(url)+'" alt="" loading="lazy">' : "";
  }

  // ---------- build the unified, searchable entry list ----------
  var ENTRIES = [];

  (window.WILDS_SKILLS || []).forEach(function(s){
    ENTRIES.push({ kind:"skill", tab:"skills", id:"skill:"+s[0], name:s[0], cat:s[1], desc:s[2] });
  });

  (window.WILDS_QUESTS_PRIMARY || []).forEach(function(q, i){
    ENTRIES.push({ kind:"quest", tab:"quests", id:"quest:p:"+q[0], name:q[0], sub:"Primary #"+(i+1),
      type:"primary", order:i+1, desc:q[1] });
  });
  Object.keys(window.WILDS_QUESTS_SECONDARY || {}).forEach(function(region){
    window.WILDS_QUESTS_SECONDARY[region].forEach(function(name){
      ENTRIES.push({ kind:"quest", tab:"quests", id:"quest:s:"+name, name:name, sub:region,
        type:"secondary", region:region, desc:"Secondary quest, "+region+"." });
    });
  });

  // Storage items browse through the dedicated Items/Storage tab (grouped by
  // chest, see drawStorage()) but are also searchable individually here (tab
  // left blank so they don't show up as their own flat browsing list).
  (window.WILDS_STORAGE || []).forEach(function(cat){
    cat.items.forEach(function(it, i){
      ENTRIES.push({ kind:"storage-item", tab:"", id:"storitem:"+cat.key+":"+i, name:it.name,
        sub:it.tier||cat.label, img:it.img, note:it.note||"", chestLabel:cat.label, item:it });
    });
  });

  // ---------- search ----------
  function norm(s){ return (s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,""); }
  function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(Boolean); }
  function haystack(e){
    var parts = [e.name, e.sub, e.desc, e.blurb, e.features, e.req, e.cat, e.slot, e.style, e.note];
    if (e.areas) parts = parts.concat(e.areas);
    if (e.names) parts = parts.concat(e.names);
    return norm(parts.filter(Boolean).join(" "));
  }
  function score(e, toks){
    var hay = haystack(e), nm = norm(e.name), hit = 0;
    for (var i=0;i<toks.length;i++){
      if (hay.indexOf(toks[i]) === -1) return -1;
      hit += nm.indexOf(toks[i]) === 0 ? 3 : (nm.indexOf(toks[i]) !== -1 ? 2 : 1);
    }
    return hit;
  }
  function search(q){
    var toks = tokens(q);
    if (!toks.length) return [];
    var out = [];
    ENTRIES.forEach(function(e){
      var sc = score(e, toks);
      if (sc >= 0) out.push([sc, e]);
    });
    out.sort(function(a,b){ return b[0]-a[0]; });
    return out.slice(0, 60).map(function(p){ return p[1]; });
  }

  // ---------- persisted tracker state ----------
  var LS_KEY = "wilds-state-v1";
  var STATE = loadState();
  function defaultState(){
    return { skills:{}, quests:{}, code:"", powerFilterOn:false, powerLevel:0, favoriteVideoIds:[],
      videoChannels:[{id:"UCRbqswsX9bDjWrQ2jxyVD3w", name:"Primitive Nomad"}],
      activeVideoChannelId:"UCRbqswsX9bDjWrQ2jxyVD3w" };
  }
  function loadState(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch(e){ return defaultState(); }
  }
  function saveState(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch(e){}
    syncSoon();
  }
  function skillLevel(name){ return STATE.skills[name] || 1; }
  function setSkillLevel(name, v){ STATE.skills[name] = Math.max(1, Math.min(99, v)); saveState(); }
  // Shared by the +/- stepper and the rotary picker, so both land in the
  // same surgical DOM update (no full redraw, so scroll position holds).
  function applySkillLevel(name, newVal, tickEl, tickClass){
    setSkillLevel(name, newVal);
    var lvl = skillLevel(name);
    document.querySelectorAll('[data-skill-level="'+name+'"]').forEach(function(el){
      el.textContent = el.classList.contains("tk-subbox-stat") ? ("Lv " + lvl) : String(lvl);
    });
    if (tickEl && tickClass){
      tickEl.classList.remove("tick-up", "tick-down");
      void tickEl.offsetWidth; // restart the animation even on repeated same-direction taps
      tickEl.classList.add(tickClass);
    }
    updateSkillTotal();
    var wrap = document.querySelector('[data-unlock-list="'+name+'"]');
    if (wrap) wrap.outerHTML = unlockListWrap(name, lvl);
  }

  // UI-only state: which tracker sub-panels are expanded. Not persisted - // rebuilt fresh each session, but must survive a drawTracker() re-render
  // triggered by clicking something *inside* an open panel.
  var openAreas = {};
  // Which of the Progress boxes (Skills/Quests) is currently expanded below
  // the grid, and which smaller sub-box inside that one (a skill category,
  // or a quest line) is expanded below its own sub-grid. One of each at a time.
  // Skills or Quests is always expanded on Progress - never both collapsed.
  var openBox = "skills";
  var openSub = null;
  // Which chest category is expanded in the Items/Storage tab.
  var openChest = null;
  // Which single item's full detail is expanded (scoped: "chest::Name" or
  // "station::Name" so the same item can be open independently in either view).
  var openItem = null;
  // "chest" (default, browse by material/category) or "station" (pick one or
  // more crafting stations and see everything makeable there, combined).
  var storageView = "chest";
  var selectedStations = {};
  // Construction drill-down state (Category -> Subcategory -> material-set
  // group(s) -> a single item's expanded materials), all scoped by key so
  // switching a higher level resets whatever was open below it.
  var openConstructionCat = null;
  var openConstructionSub = null;
  var openConstructionGroups = {};
  // "items" (default) or "construction" - which box is open on the
  // Catalogue tab, same one-of-several-boxes pattern as Progress.
  var catalogueView = "items";

  // Tap a material/recipe chip anywhere (a recipe's materials, a used-in
  // list, a Construction card) and jump straight to that item's own entry -
  // swipe left-to-right (or tap Back) to return exactly where you were,
  // as many levels deep as you've jumped. The app has no other use for a
  // horizontal gesture (scrolling is vertical-only throughout), so the
  // swipe is unambiguous.
  var NAV_STACK = [];
  function findItemChest(name){
    var cats = window.WILDS_STORAGE || [];
    for (var i = 0; i < cats.length; i++){
      if (cats[i].items.some(function(it){ return it.name === name; })) return cats[i].key;
    }
    return null;
  }
  var navBackBtn;
  function updateNavBackBtn(){
    if (navBackBtn) navBackBtn.hidden = !NAV_STACK.length;
  }
  function navSnapshot(){
    return {
      tab: view.tab, catalogueView: catalogueView, storageView: storageView,
      openChest: openChest, openItem: openItem, selectedStations: Object.assign({}, selectedStations),
      openConstructionCat: openConstructionCat, openConstructionSub: openConstructionSub,
      openConstructionGroups: Object.assign({}, openConstructionGroups),
      scrollY: window.scrollY
    };
  }
  // Scrolls so el's top sits just under the sticky search bar, rather than
  // merely "somewhere on screen" - getBoundingClientRect alone would still
  // leave it hidden behind .hero.
  function scrollToElementTop(el){
    if (!el){ window.scrollTo(0, 0); return; }
    var heroEl = document.querySelector(".hero");
    var heroH = heroEl ? heroEl.offsetHeight : 0;
    window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - heroH - 10));
  }
  function navToMaterial(name){
    var chestKey = findItemChest(name);
    if (!chestKey) return;
    NAV_STACK.push(navSnapshot());
    view.tab = "storage"; view.q = ""; qInput.value = ""; clearBtn.classList.remove("on");
    catalogueView = "items";
    storageView = "chest";
    openChest = chestKey;
    openItem = "chest:" + chestKey + "::" + name;
    if (STATE.powerFilterOn){
      var cat = (window.WILDS_STORAGE || []).filter(function(c){ return c.key === chestKey; })[0];
      var it = cat && cat.items.filter(function(x){ return x.name === name; })[0];
      if (it && it.step > STATE.powerLevel){ STATE.powerFilterOn = false; saveState(); }
    }
    draw();
    scrollToElementTop(document.querySelector('[data-item="'+CSS.escape(openItem)+'"]'));
    updateNavBackBtn();
  }
  function navBack(){
    if (!NAV_STACK.length) return;
    var s = NAV_STACK.pop();
    view.tab = s.tab; catalogueView = s.catalogueView; storageView = s.storageView;
    openChest = s.openChest; openItem = s.openItem; selectedStations = s.selectedStations;
    openConstructionCat = s.openConstructionCat; openConstructionSub = s.openConstructionSub;
    openConstructionGroups = s.openConstructionGroups;
    draw();
    window.scrollTo(0, s.scrollY || 0);
    updateNavBackBtn();
  }

  // ---------- view state ----------
  // Progress is the app's home now - there's no separate landing screen to
  // navigate away from and back to.
  var view = { tab: "tracker", q: "" };

  var $ = function(sel, root){ return (root||document).querySelector(sel); };
  var qInput = $("#q"), clearBtn = $("#clear"), resultsEl = $("#results"),
      countEl = $("#count"), trackerEl = $("#tracker"), tabbarEl = $("#tabbar"), gearBtn = $("#gearBtn"),
      iconLightboxEl = $("#iconLightbox"), iconLightboxImgEl = $("#iconLightboxImg"), iconLightboxCaptionEl = $("#iconLightboxCaption");
  navBackBtn = $("#navBackBtn");
  navBackBtn.addEventListener("click", navBack);
  // Swipe right anywhere to go back - the app never scrolls horizontally
  // (vertical-only throughout), so this gesture is free to reclaim, and a
  // mouse user gets the same "‹ Back" button instead.
  (function(){
    var sx = null, sy = null, st = 0;
    document.addEventListener("touchstart", function(e){
      if (!NAV_STACK.length || !e.touches.length) { sx = null; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    }, { passive: true });
    document.addEventListener("touchend", function(e){
      if (sx == null || !e.changedTouches.length) return;
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, dt = Date.now() - st;
      sx = null;
      if (dx > 70 && Math.abs(dy) < 60 && dt < 700) navBack();
    }, { passive: true });
  })();

  // Tap any item/station icon to see it bigger - the wiki's own art, full
  // size, nothing fancier. One overlay shared by every icon in the app
  // (Items, Construction, stations) rather than per-context markup.
  function openIconLightbox(src, caption){
    if (!src) return;
    iconLightboxImgEl.src = src;
    iconLightboxCaptionEl.textContent = caption || "";
    iconLightboxEl.hidden = false;
  }
  function closeIconLightbox(){ iconLightboxEl.hidden = true; iconLightboxImgEl.src = ""; }
  iconLightboxEl.addEventListener("click", closeIconLightbox);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !iconLightboxEl.hidden) closeIconLightbox();
  });
  function nearbyIconName(img){
    var host = img.closest(".item-tile, .mat-chip, .cc-card, .tk-subbox, .item-detail, .cc-head");
    if (!host) return "";
    var nameEl = host.querySelector(".item-tile-name, .mat-chip-text, .cc-name, .tk-subbox-label, h5");
    return nameEl ? nameEl.textContent.trim() : "";
  }

  // Number picker: on touch, a scroll wheel instead of mashing +/- up to 98
  // times; on a mouse/trackpad, typing is faster, so it's a plain numeric
  // field instead - (pointer: coarse) is the real signal for which makes
  // sense, not screen width (a touch tablet at desktop width still wants
  // the wheel; a mouse in a narrow window still wants to type).
  var numPickerEl = $("#numPicker"), numPickerTitleEl = $("#numPickerTitle"),
      numPickerWheelEl = $("#numPickerWheel"), numPickerDoneEl = $("#numPickerDone");
  var NUM_PICKER_ROW_H = 42;
  var numPickerOnCommit = null;
  function numPickerIsCoarse(){ return !(window.matchMedia && window.matchMedia("(pointer: fine)").matches); }
  function openNumPicker(title, min, max, value, onCommit){
    numPickerOnCommit = onCommit;
    numPickerTitleEl.textContent = title;
    numPickerWheelEl.dataset.min = min;
    numPickerWheelEl.dataset.max = max;
    var coarse = numPickerIsCoarse();
    numPickerWheelEl.dataset.mode = coarse ? "wheel" : "input";
    if (coarse){
      var pad = NUM_PICKER_ROW_H * 2;
      var rows = [];
      for (var n = min; n <= max; n++){
        rows.push('<div class="num-picker-wheel-row" data-n="'+n+'">'+n+'</div>');
      }
      numPickerWheelEl.innerHTML = rows.join("");
      numPickerWheelEl.style.padding = pad + "px 0";
      numPickerWheelEl.parentElement.classList.remove("num-picker-wheel-as-input");
      numPickerEl.hidden = false;
      numPickerWheelEl.scrollTop = (Math.max(min, Math.min(max, value)) - min) * NUM_PICKER_ROW_H;
      markNumPickerSelection();
    } else {
      numPickerWheelEl.style.padding = "0";
      numPickerWheelEl.parentElement.classList.add("num-picker-wheel-as-input");
      numPickerWheelEl.innerHTML = '<input type="number" inputmode="numeric" class="num-picker-input" id="numPickerInput" min="'+min+'" max="'+max+'" value="'+value+'">';
      numPickerEl.hidden = false;
      var inp = $("#numPickerInput");
      inp.addEventListener("keydown", function(e){ if (e.key === "Enter") commitNumPicker(); });
      setTimeout(function(){ inp.focus(); inp.select(); }, 20);
    }
  }
  function closeNumPicker(){ numPickerEl.hidden = true; numPickerOnCommit = null; }
  function numPickerScrollTopFor(v){ return (v - parseInt(numPickerWheelEl.dataset.min, 10)) * NUM_PICKER_ROW_H; }
  function numPickerCenteredValue(){
    if (numPickerWheelEl.dataset.mode === "input"){
      var inp = $("#numPickerInput");
      if (!inp) return null;
      var min = parseInt(numPickerWheelEl.dataset.min, 10), max = parseInt(numPickerWheelEl.dataset.max, 10);
      var v = parseInt(inp.value, 10);
      if (isNaN(v)) return null;
      return Math.max(min, Math.min(max, v));
    }
    var rows = numPickerWheelEl.querySelectorAll(".num-picker-wheel-row");
    if (!rows.length) return null;
    var idx = Math.round(numPickerWheelEl.scrollTop / NUM_PICKER_ROW_H);
    idx = Math.max(0, Math.min(rows.length - 1, idx));
    return parseInt(rows[idx].dataset.n, 10);
  }
  function markNumPickerSelection(){
    var v = numPickerCenteredValue();
    numPickerWheelEl.querySelectorAll(".num-picker-wheel-row").forEach(function(row){
      row.classList.toggle("sel", parseInt(row.dataset.n, 10) === v);
    });
  }
  var numPickerScrollTimer = null;
  numPickerWheelEl.addEventListener("scroll", function(){
    if (numPickerWheelEl.dataset.mode === "input") return;
    markNumPickerSelection();
    clearTimeout(numPickerScrollTimer);
    numPickerScrollTimer = setTimeout(function(){
      var v = numPickerCenteredValue();
      if (v != null) numPickerWheelEl.scrollTo({ top: numPickerScrollTopFor(v), behavior: "smooth" });
    }, 110);
  });
  numPickerWheelEl.addEventListener("click", function(e){
    var row = e.target.closest(".num-picker-wheel-row");
    if (row) numPickerWheelEl.scrollTo({ top: numPickerScrollTopFor(parseInt(row.dataset.n, 10)), behavior: "smooth" });
  });
  function commitNumPicker(){
    var v = numPickerCenteredValue();
    var cb = numPickerOnCommit;
    closeNumPicker();
    if (cb && v != null) cb(v);
  }
  numPickerDoneEl.addEventListener("click", commitNumPicker);
  numPickerEl.addEventListener("click", function(e){ if (e.target === numPickerEl) commitNumPicker(); });

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  }); }

  // "Bounce in only what's new" tracking: every top-level drawX() function
  // resets curVisibleKeys, then calls nk(key) once per element it renders
  // (a stable identity for that element - a chest key, an item's scope::name,
  // a channel id...). nk() marks the element " pop-pending" the first time a
  // key shows up since the last full render pass, "" if it was already there
  // - so an element whose identity persisted across a redraw (even though
  // its DOM node was just recreated by the innerHTML swap) doesn't replay
  // the animation, and only genuinely newly-revealed content bounces.
  // "pop-pending" rather than the animation class itself because a card
  // rendered below the fold would otherwise burn its one bounce while
  // off-screen - activateReveals() (run right after every render pass) only
  // promotes it to the real ".pop-in" animation once it actually scrolls
  // into view, so the bounce still lands even for content you had to scroll
  // to reach.
  var prevVisibleKeys = {}, curVisibleKeys = {};
  function nk(key){
    curVisibleKeys[key] = true;
    return prevVisibleKeys[key] ? "" : " pop-pending";
  }
  function beginVisiblePass(){ curVisibleKeys = {}; }
  // A copy, not the same object - so an nk() call from outside a pass (e.g.
  // infinite-scroll appending a video thumb straight into the DOM, with no
  // begin/endVisiblePass around it) can't quietly mutate what the next real
  // pass compares against.
  function endVisiblePass(){ prevVisibleKeys = Object.assign({}, curVisibleKeys); activateReveals(); }

  var revealObserver = null;
  function getRevealObserver(){
    if (!revealObserver && "IntersectionObserver" in window){
      revealObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (!entry.isIntersecting) return;
          entry.target.classList.remove("pop-pending");
          entry.target.classList.add("pop-in");
          // A fast scroll can cross a whole screenful of these in one go, all
          // landing in the same observer callback - the nth-child stagger
          // meant for "everything bounces in together when you open a panel"
          // would otherwise queue them up behind each other here too, so a
          // quick scroll looks like nothing happened until it "catches up".
          // Each one earns its bounce the moment it's actually seen instead.
          entry.target.style.animationDelay = "0ms";
          revealObserver.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px 40px 0px", threshold: 0.01 });
    }
    return revealObserver;
  }
  // Anything already on screen bounces right away, same as before; anything
  // below the fold waits for the user to actually scroll it into view.
  function activateReveals(){
    var pending = trackerEl.querySelectorAll(".pop-pending");
    if (!pending.length) return;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var obs = getRevealObserver();
    pending.forEach(function(el){
      var r = el.getBoundingClientRect();
      if (!obs || (r.top < vh && r.bottom > 0)){
        el.classList.remove("pop-pending");
        el.classList.add("pop-in");
      } else {
        obs.observe(el);
      }
    });
  }

  function questWalkthroughHtml(name){
    var w = window.WILDS_QUEST_WALKTHROUGHS && window.WILDS_QUEST_WALKTHROUGHS[name];
    if (!w) return '';
    var html = '';
    if (w.img) html += '<div class="wide"><img src="'+esc(w.img)+'" alt="" loading="lazy" style="width:100%;border-radius:var(--r);border:1px solid var(--edge-dark);display:block"></div>';
    if (w.youtube) html += '<a class="video-channel-link" href="'+esc(w.youtube)+'" target="_blank" rel="noopener">▶ Watch a guide on YouTube</a>';
    if (w.requirements) html += '<div class="wide"><div class="fk">Requirements</div><div class="fv">'+esc(w.requirements)+'</div></div>';
    if (w.rewards) html += '<div class="wide"><div class="fk">Rewards</div><div class="fv">'+esc(w.rewards)+'</div></div>';
    if (w.steps && w.steps.length){
      html += '<div class="r block"><div class="fk">Walkthrough</div><ol class="steps">'+
        w.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ol></div>';
    } else if (w.stub){
      html += '<div class="note">Detailed walkthrough not yet documented for this quest.</div>';
    }
    if (questMapEntries(name)){
      html += '<div class="r block"><div class="fk">Interactive map</div>'+
        '<div class="q-map-wrap" data-quest-map-name="'+esc(name)+'" role="button" tabindex="0">'+

        '<span class="q-map-cta">Tap to explore ›</span></div></div>';

    if (w.gallery && w.gallery.length){
      html += '<div class="r block"><div class="fk">Maps &amp; pictures</div><div class="q-gallery">'+
        w.gallery.map(function(g){
          return '<figure class="q-fig"><a href="'+esc(g.img)+'" target="_blank" rel="noopener"><img src="'+esc(g.img)+'" alt="" loading="lazy"></a>'+
            (g.caption ? '<figcaption>'+esc(g.caption)+'</figcaption>' : '')+'</figure>';
        }).join('')+'</div></div>';

    if (w.tips && w.tips.length){

  function renderCard(e){
    if (e.kind === "skill"){
      var lvl = skillLevel(e.name);

    }
    if (e.kind === "quest"){

  // ---------- main draw ----------
  function draw(){
    drawTabbar();
    var q = view.q.trim();
    trackerEl.hidden = true;
    teardownVideos();
    teardownMap();
    teardownUpdates();

    if (view.tab === "tracker" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawTracker();
      return;
    }
    if (view.tab === "settings" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawSettings();
      return;
    }
    if (view.tab === "storage" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawStorage();
      return;
    }
    if (view.tab === "map" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawMap();
      return;
    }
    if (view.tab === "videos" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawVideos();
      refreshVideosIfStale();
      return;
    }
    if (view.tab === "updates" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawUpdates();
      return;
    }

    var list, title;
    if (q){
      list = search(q);
      title = "Results";
    } else {
      list = ENTRIES.filter(function(e){ return e.tab === view.tab; });
      title = TAB_LABEL[view.tab];
    }

    var extras = "";

    if (!list.length && !extras){
      countEl.textContent = "";
      resultsEl.innerHTML = '<div class="empty"><b>Nothing here yet</b>Try a different search.</div>';
      return;
    }

    countEl.textContent = title ? (title + " · " + list.length) : "";
    var cards = list.map(renderCard).join("");
    resultsEl.innerHTML = extras + (q ? cards : '<div class="results-grid">'+cards+'</div>');
  }

  // Shared by the Skills reference card and the Progress tracker's expandable
  // row, so the two never drift out of sync with each other.
  function unlockListHtml(name, lvl){
    var list = (window.WILDS_LEVEL_UNLOCKS && window.WILDS_LEVEL_UNLOCKS[name]) || [];
    if (!list.length) return '<div class="note">No confirmed level unlocks documented for this skill yet.</div>';
    return '<div class="chk">'+list.map(function(u){

        (u.note ? '<span class="req">'+esc(u.note)+'</span>' : '')+'</div></div>';
