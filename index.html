<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15120F">
<title>Wilds - RuneScape: Dragonwilds companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette lifted from the classic RuneScape interface panel: dark oak,
   parchment text, gold accents, hard bevel edges instead of iOS rounding.
   Font is Cinzel (free, Google Fonts) for a similar carved-stone feel to the
   game's own UI font, without using Jagex's actual proprietary typeface. */
:root{
  color-scheme:dark;
  /* Obsidian-dragon base: a cool near-black instead of flat oak-brown, so
     the gold/ember/mystic accents (and item icons) actually pop instead of
     competing with a muddy brown backdrop. */
  --bg:#131118;
  --panel:#211e28;
  --panel2:#282531;
  --panel3:#332f3d;
  --edge-dark:#09080d;
  --edge-light:#4d4860;
  --gold:#ffb000;
  --gold-dim:rgba(255,176,0,.16);
  --text:#efe6d6;
  --text2:#beb2a8;
  --text3:#8f8597;
  --green:#5fbf4f;
  --red:#e2554f;
  /* Dragonwilds accent trio - dragonfire ember, wild emerald, arcane mystic.
     With the cooler obsidian base these now carry most of the "color" in
     the UI instead of being a light garnish on brown. */
  --ember:#ff7347;
  --ember-dim:rgba(255,115,71,.18);
  --emerald:#3ecf8e;
  --mystic:#a78bfa;
  --note-bg:rgba(255,176,0,.12);
  --note-fg:#e8c27a;
  --shadow:0 2px 0 var(--edge-dark), 0 6px 16px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
  --head:'Cinzel',Georgia,'Times New Roman',serif;
  --ui:Georgia,'Times New Roman',serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --r-lg:18px;
  --tb:4.3rem;
}
/* touch-action:manipulation stops rapid taps (e.g. hammering a stepper's
   + button) from being read as a double-tap-to-zoom gesture on mobile
   Safari/Chrome. Pinch-zoom stays available since only double-tap is cut. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
/* touch-action is the intersection of an element's own value and all its
   ancestors', so pinning the root to pan-y blocks horizontal swipe/pan
   (and the browser's edge-swipe back/forward gesture) everywhere, while
   the per-element "manipulation" above still kills the double-tap delay. */
html,body{margin:0;padding:0;touch-action:pan-y}
body{
  background:
    radial-gradient(ellipse at top, rgba(255,176,0,.09), transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(255,115,71,.07), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(167,139,250,.07), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
  overscroll-behavior-y:contain;
}
.wrap{max-width:720px;margin:0 auto;padding:0 1rem;width:100%}

.hero{
  position:sticky;top:0;z-index:15;background:var(--bg);
  padding-top:calc(.6rem + env(safe-area-inset-top));
  padding-bottom:.7rem;flex-shrink:0;
  border-bottom:1px solid var(--edge-dark);
}
.hero-row{display:flex;align-items:center;gap:.5rem}
.hero-row .searchbox{flex:1;min-width:0}
.gear-btn{
  flex-shrink:0;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(122,103,72,.35);
}
.gear-btn svg{width:20px;height:20px}
.gear-btn:active{background:var(--panel3)}
.searchbox{position:relative}
.searchbox input{
  width:100%;background:var(--panel2);border:1px solid var(--edge-dark);
  color:var(--text);font-family:var(--ui);font-size:16px;
  padding:.65rem 2.2rem .65rem .8rem;outline:none;border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(122,103,72,.35);
}
.searchbox input::placeholder{color:var(--text3)}
.searchbox input:focus{box-shadow:0 0 0 2px var(--gold-dim), inset 0 1px 0 rgba(0,0,0,.4)}
.searchbox .clear{
  position:absolute;right:.3rem;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--text3);font-size:1.35rem;line-height:1;
  padding:.35rem .6rem;cursor:pointer;display:none;
}
.searchbox .clear.on{display:block}


main.wrap{flex-shrink:0;padding-bottom:calc(var(--tb) + 2rem + env(safe-area-inset-bottom))}
.sect{display:flex;align-items:baseline;gap:.5rem;margin:.9rem 0 .5rem}
.count{
  font-family:var(--head);font-size:13px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text3);margin:.9rem 0 .5rem;
}
.count:empty{display:none;margin:0}

.card{
  background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);
  margin-bottom:.55rem;overflow:hidden;box-shadow:var(--shadow);
}
.card.open>button{background:var(--panel3)}
.card>button{width:100%;background:none;border:0;color:inherit;text-align:left;padding:.7rem .85rem;cursor:pointer;display:flex;align-items:baseline;gap:.5rem;font-family:inherit}
.card h2{margin:0;font-family:var(--head);font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.card-icon{display:inline-flex;align-self:center;color:var(--gold);flex-shrink:0}
.card-icon svg{width:18px;height:18px;display:block}
.card-icon img{width:20px;height:20px;object-fit:contain;display:block}
.card .sub{margin-left:auto;font-size:12px;color:var(--gold);text-align:right;flex-shrink:0;max-width:45%;font-weight:600}
.tagline{display:inline-block;font-size:10px;font-weight:700;color:var(--bg);background:var(--gold);border-radius:2px;padding:.15rem .4rem;margin-right:.4rem;vertical-align:.1em;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}

/* Regions and Crafting browse as a grid of small tappable boxes, same
   language as the Progress skill grid - tap one and it expands to full
   width right where it was, pushing the rest down until it's closed. */
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.results-grid .card{margin-bottom:0}
.results-grid .card>button{flex-direction:column;align-items:flex-start;gap:.2rem;padding:.65rem .75rem}
.results-grid .card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold)}
.results-grid .card .sub{margin-left:0;text-align:left;max-width:100%;color:var(--text3);font-weight:600}
.results-grid .card.open{grid-column:1 / -1}
.body{padding:.1rem .85rem .85rem;border-top:1px solid var(--edge-dark)}
.rows{padding-top:.15rem}
.r{padding:.5rem 0}
.r.block{border-top:1px solid var(--edge-dark);margin-top:.3rem;padding-top:.6rem}
.fk{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fk.subhead{display:block;margin:.7rem 0 .3rem;color:var(--gold)}
.fk.subhead:first-child{margin-top:0}
.fv{font-size:15px;line-height:1.5;color:var(--text2)}
.wide{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.45rem .6rem;margin:.35rem 0}
.wide .fk{margin-bottom:.15rem}
.steps{margin:.3rem 0 0;padding-left:1.3rem;color:var(--text2);font-size:15px;line-height:1.6}
.steps li{margin-bottom:.4rem}
.steps li::marker{color:var(--gold);font-weight:700}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--edge-light);border-radius:999px;padding:.3rem .7rem;font-size:12px;margin:.15rem .3rem .15rem 0;color:var(--text2)}
.pillrow{margin:.3rem 0}
.note{margin-top:.6rem;padding:.6rem .7rem;background:var(--note-bg);border:1px solid rgba(255,176,0,.3);border-radius:var(--r);font-size:13px;color:var(--note-fg)}
.empty{text-align:center;color:var(--text3);padding:2.5rem 1rem;font-size:15px}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:.3rem;font-family:var(--head)}

.tbl{width:100%;border-collapse:collapse;margin:.4rem 0 .2rem;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--edge-dark)}
.tbl th{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tbl td{color:var(--text2)}
.tblwrap{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:.2rem .5rem;margin-bottom:.9rem;overflow-x:auto}

/* Interface tab row, RuneScape-style - pinned so it's always reachable,
   with a comfortably tall touch target and extra clearance under it (not
   just the bare safe-area inset) so it doesn't sit flush against the
   phone OS's bottom edge-gesture strip. Three tabs, evenly filling the
   width like a normal bottom nav bar - no more horizontal scrolling. */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;min-height:var(--tb);flex-shrink:0;
  background:var(--panel);border-top:1px solid var(--edge-light);
  box-shadow:0 -2px 10px rgba(0,0,0,.4);
  padding:.55rem 0 calc(env(safe-area-inset-bottom) + .55rem);
}
.tabbar button{
  flex:1 1 0;background:none;border:0;border-top:2px solid transparent;
  color:var(--text3);font-family:var(--head);font-size:12.5px;font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;cursor:pointer;
  padding:.35rem .3rem;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.4rem;
}
.tabbar button svg{width:19px;height:19px;flex-shrink:0}
.tabbar button.on{color:var(--gold);border-top-color:var(--gold);border-image:linear-gradient(90deg,var(--ember),var(--gold)) 1}
.tabbar button:active{background:var(--panel3)}

/* checklist rows: quests, bestiary sightings */
.chk{margin-top:.2rem}
.chk .row{display:flex;align-items:flex-start;gap:.6rem;padding:.5rem .1rem;cursor:pointer;border-bottom:1px solid var(--edge-dark)}
.chk .row:last-child{border-bottom:0}
.chk .box{
  flex-shrink:0;width:20px;height:20px;border-radius:2px;margin-top:1px;
  background:var(--panel2);border:1px solid var(--edge-light);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:transparent;
}
.chk .row.on .box{background:var(--green);border-color:var(--green);color:#0e1a0d}
.chk .t{font-size:14px;line-height:1.4;color:var(--text2)}
.chk .row.on .t{color:var(--text3);text-decoration:line-through}
.chk .t .req{display:block;font-size:12px;color:var(--text3);margin-top:.1rem}
.chk .row.on .t .req{color:var(--text3)}
@keyframes boxPop{0%{transform:scale(.7)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.chk .row.pop .box{animation:boxPop .3s cubic-bezier(.2,.9,.3,1) 1}

/* region / group cards inside the tracker: header + progress + checklist body */
.area{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);margin-bottom:.5rem;overflow:hidden;box-shadow:var(--shadow)}
.area>button{width:100%;background:none;border:0;color:inherit;text-align:left;padding:.7rem .8rem;cursor:pointer;font-family:inherit}
.area .hd{display:flex;align-items:baseline;gap:.5rem}
.area .hd b{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text)}
.area .hd span{margin-left:auto;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums}
.area.full .hd span{color:var(--green);font-weight:700}
.area .body{padding:.2rem .8rem .6rem}

/* skill rows with a stepper for level */
.fd{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-bottom:1px solid var(--edge-dark)}
.fd:last-child{border-bottom:0}
.fd-icon{display:flex;flex-shrink:0;color:var(--gold)}
.fd-icon svg{width:19px;height:19px}
.fd .nm{font-family:var(--head);font-size:14px;line-height:1.2;flex:1;min-width:0;color:var(--text)}
.fd .nm .cat{display:block;font-family:var(--ui);font-size:11px;color:var(--text3);margin-top:2px;text-transform:none}
.fd .stp{margin-left:auto;display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.fd .stp button{width:28px;height:28px;border:1px solid var(--edge-dark);background:var(--panel2);color:var(--gold);border-radius:var(--r);font-size:16px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.fd .stp button:active{background:var(--gold);color:var(--bg)}
.fd .stp .v{min-width:34px;text-align:center;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--head);display:inline-block}
@keyframes tickUp{0%{transform:scale(1.55)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes tickDown{0%{transform:scale(1.35);color:var(--red)}55%{transform:scale(1.1);color:var(--red)}100%{transform:scale(1)}}
.tick-up{animation:tickUp .3s cubic-bezier(.2,.9,.3,1) 1}
.tick-down{animation:tickDown .28s cubic-bezier(.2,.9,.3,1) 1}
.fd-name{display:flex;align-items:center;gap:.5rem;flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.chevron-btn{margin-left:auto;flex-shrink:0;background:none;border:0;color:var(--text3);font-size:20px;line-height:1;cursor:pointer;padding:.2rem .3rem;transition:transform .15s ease}
.chevron-btn.open{transform:rotate(90deg);color:var(--gold)}
.quest-detail{padding:.5rem .8rem .7rem 2.7rem;border-bottom:1px solid var(--edge-dark);background:var(--panel2)}
.quest-detail:last-child{border-bottom:0}
.quest-detail .chk .row{padding:.35rem 0}
.quest-detail .note{margin:0}
.fdwrap{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:.9rem;overflow:hidden}

.tk-head{margin:1rem 0 .4rem}
.tk-head h2{font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:.01em;margin:0 0 .5rem;color:var(--gold);text-shadow:0 0 16px rgba(255,176,0,.3)}
.tk-head-note{margin:-.3rem 0 .8rem;font-size:13px;color:var(--text3)}
.video-embed{position:relative;width:100%;padding-top:56.25%;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;margin-top:.8rem}
.video-thumb{position:relative;padding:0;border:2px solid var(--edge-dark);border-radius:var(--r);overflow:hidden;background:var(--panel);cursor:pointer;aspect-ratio:16/9}
.video-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.video-thumb.active{border-color:var(--gold)}
.video-channel-link{display:block;text-align:center;margin-top:.8rem;padding:.65rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);font-family:var(--head);font-size:13px;font-weight:700;text-decoration:none}
.video-channel-link:active{background:var(--panel3)}
.power-ctl{display:flex;align-items:center;flex-wrap:wrap;gap:.7rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.6rem .75rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.power-toggle{display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--text2);cursor:pointer}
.power-toggle input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.power-stp{display:flex;align-items:center;gap:.5rem;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.power-stp button{width:24px;height:24px;border:1px solid var(--edge-dark);background:var(--panel2);color:var(--gold);border-radius:var(--r);font-size:14px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.power-stp button:active{background:var(--gold);color:var(--bg)}
.bar{height:8px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:2px;overflow:hidden;margin-top:.45rem}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.bar.done i{background:var(--green)}
.tk-goal{background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.65rem .8rem;margin-bottom:.45rem;box-shadow:var(--shadow)}
.tk-goal .t{display:flex;align-items:baseline;gap:.5rem;font-size:15px}
.tk-goal .t b{font-family:var(--head);font-weight:600;color:var(--text)}
.tk-goal .t span{margin-left:auto;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums}
.tk-goal.hit .t span{color:var(--green);font-weight:700}

.tk-section{margin-top:1.6rem}
.tk-section h3{font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:.01em;margin:0 0 .5rem;color:var(--gold)}

/* Progress home: a grid of tappable summary boxes instead of one long
   stacked page - tap a box to reveal its full list below the grid. */
.tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.tk-box{
  display:flex;flex-direction:column;gap:.15rem;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:.85rem;color:inherit;font-family:inherit;
}
.tk-box.open{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tk-box:active{background:var(--panel3)}
.tk-box-label{font-family:var(--head);font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.tk-box-stat{font-family:var(--head);font-size:21px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.tk-box-sub{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-box .bar{margin-top:.3rem}
.tk-panel h3{font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.01em;margin:0 0 .6rem;color:var(--gold)}
.tk-panel .tk-section:first-child{margin-top:0}

/* second drill-down level: skill categories inside the Skills box, quest
   lines inside the Quests box */
.tk-subgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tk-subbox{
  display:flex;flex-direction:column;gap:.1rem;text-align:left;cursor:pointer;
  background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r-lg);
  padding:.65rem .75rem;color:inherit;font-family:inherit;
}
.tk-subbox.open{border-color:var(--gold)}
.tk-subbox:active{background:var(--panel3)}
.tk-subbox-label{font-family:var(--head);font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.tk-subbox-stat{font-family:var(--head);font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.tk-subbox-sub{font-size:11px;color:var(--text3)}
.tk-subbox .bar{margin-top:.25rem;height:5px}
.tk-subpanel{margin-top:.75rem}
.tk-subpanel h4{font-family:var(--head);font-size:15px;font-weight:700;color:var(--text);margin:0 0 .4rem}
/* skill box: tap the icon/name to expand, but the stepper works right
   there without opening anything */
.tk-skillbox{cursor:default}
.tk-skillbox-main{display:flex;align-items:center;gap:.5rem;width:100%;background:none;border:0;margin:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tk-skillbox-stp{display:flex;align-items:center;gap:.4rem;margin-top:.35rem}
.tk-skillbox-stp button{width:26px;height:26px;flex-shrink:0;border:1px solid var(--edge-dark);background:var(--panel);color:var(--gold);border-radius:var(--r);font-size:15px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.tk-skillbox-stp button:active{background:var(--gold);color:var(--bg)}
/* the open skill's detail spans the full grid width, right where it was
   tapped - remaining boxes flow below it until it's closed again */
.tk-subgrid > .tk-subpanel{grid-column:1 / -1;margin-top:0}

/* Items/Storage: a chest's contents as a small icon grid, images hotlinked
   straight from the wiki */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:.5rem;max-height:70vh;overflow-y:auto;padding-right:.1rem}
.item-tile{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.4rem .3rem;text-align:center;width:100%;color:inherit;font-family:inherit;cursor:pointer}
.item-tile.open{border-color:var(--gold)}
.item-tile:active{background:var(--panel3)}
.item-tile-img{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:.3rem;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.015) 70%);border-radius:8px}
.item-tile-img img{max-width:34px;max-height:34px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.item-tile-noimg{color:var(--text3);font-size:11px}
.item-tile-name{font-size:10.5px;line-height:1.25;color:var(--text2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item-tile-tier{margin-top:.2rem;font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.02em}
.item-tile-tier.tier-ember{color:var(--ember)}
.item-tile-tier.tier-mystic{color:var(--mystic)}
.item-tile-tier.tier-teal{color:#2dd4bf}
.item-tile:has(.tier-ember){box-shadow:0 0 0 1px var(--ember-dim)}
.item-tile:has(.tier-mystic){box-shadow:0 0 0 1px rgba(155,127,232,.18)}
.item-grid > .item-detail{grid-column:1 / -1;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r-lg);padding:.7rem .85rem;box-shadow:var(--shadow)}
.item-detail h5{margin:0 0 .4rem;font-family:var(--head);font-size:15px;font-weight:700;color:var(--text)}
.item-detail-desc{white-space:pre-wrap}
/* Stats laid out two-up so you can scan them at a glance instead of one
   long single-column list - the "split screen" view. */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.3rem}
.stat-chip{background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.4rem .55rem}
.stat-chip .fk{display:block;font-size:10px}
.stat-chip .fv{font-size:13px;color:var(--text)}
.mat-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem}
.mat-chip{display:flex;align-items:center;gap:.35rem;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:999px;padding:.2rem .6rem .2rem .25rem}
.mat-chip img{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.mat-chip-text{font-size:12px;color:var(--text2)}
.mat-chip-text b{color:var(--gold)}

.view-tabs{display:flex;gap:.5rem;margin-bottom:.6rem}
.view-tab{flex:1;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);padding:.5rem;color:var(--text3);font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.view-tab.on{color:var(--gold);border-color:var(--gold)}

.sy{text-align:center;margin-bottom:.2rem}
.sy b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.03em;color:var(--gold);padding:.5rem 0;word-break:break-all}
#syIn{width:100%;margin-top:.6rem;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:16px;padding:.6rem;text-align:center;letter-spacing:.03em}
.bk{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.bk button{flex:1;min-width:88px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--gold);font-family:var(--ui);font-size:14px;font-weight:600;padding:.55rem .5rem;cursor:pointer}
.bk button:active{opacity:.6}
#bkBox{width:100%;margin-top:.6rem;min-height:88px;background:var(--panel2);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:12px;padding:.5rem;resize:vertical}
#bkMsg{margin-top:.5rem;font-size:13px;color:var(--text2)}
#bkMsg.ok{color:var(--green)}
#bkMsg.bad{color:var(--red)}
.tk-reset{margin-top:1.2rem;background:var(--panel);border:1px solid var(--edge-dark);border-radius:var(--r);color:var(--red);font-family:var(--head);font-size:15px;font-weight:600;padding:.75rem 1rem;cursor:pointer;width:100%;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

@keyframes bodyIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.body.in{animation:bodyIn .18s ease-out 1}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
#results .card{animation:cardIn .16s ease-out 1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .card>button{flex-direction:column;align-items:flex-start;gap:.15rem}
  .card .sub{margin-left:0;text-align:left;max-width:100%}
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="wrap hero-row">
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Search skills, quests, items…" aria-label="Search">
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </div>
    <button class="gear-btn" id="gearBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-dasharray="2.1 2.55" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</section>

<main class="wrap">
  <div id="tracker" hidden></div>
  <div class="count" id="count"></div>
  <div id="results"></div>
</main>

<nav class="tabbar" id="tabbar"></nav>

<script src="skills.js"></script>
<script src="level-unlocks.js" onerror="this.remove()"></script>
<script src="quests.js"></script>
<script src="quest-walkthroughs.js" onerror="this.remove()"></script>
<script src="storage.js"></script>
<script>
(function(){

  var TABS = [
    {key:"tracker", label:"Progress"},
    {key:"storage", label:"Items"},
    {key:"videos", label:"Videos"}
  ];
  var TAB_LABEL = {}; TABS.forEach(function(t){ TAB_LABEL[t.key] = t.label; });

  // Original line-art icons (not the game's own assets) paired with the
  // word labels in the tab bar.
  var ICONS = {
    storage: '<rect x="4" y="9" width="16" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 9 6 4h12l2 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    tracker: '<path d="M5 19V10M11 19V5M17 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    videos: '<rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/>'
  };

  // One small original glyph per skill, as a visual aid next to the name - // a quick shape to scan for rather than reading twelve words each time.
  var SKILL_ICONS = {
    "Attack": '<path d="M6 18 16 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 13.5 10.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="19" r="1.1" fill="currentColor" stroke="none"/>',
    "Magic": '<path d="M12 3 13.4 10.6 21 12 13.4 13.4 12 21 10.6 13.4 3 12 10.6 10.6Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
    "Ranged": '<path d="M6 4c6 2 6 14 0 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    "Mining": '<path d="M16 4 6 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 15l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13 3c2.2-.3 5 .8 6.3 2.7-2 1.6-4.8 1.9-6.9 1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    "Woodcutting": '<path d="M8 20 17 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 9c1.5-2.5 4.5-3.7 7-3-1 2.3-1.2 5.3-3.6 6.8-1.2.8-2.7.6-3.4-.4-.8-1.1-.7-2.6 0-3.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    "Artisan": '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    "Construction": '<rect x="4" y="6" width="16" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="11" width="16" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="16" width="16" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    "Cooking": '<path d="M12 3c2 3-1 4-1 6.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.7-1.4 2.4-3 2 1.6 3.3 4.2 3.3 6.5 0 3.6-3.1 6.5-7 6.5s-7-2.9-7-6.5c0-3.4 2.2-5.7 4-8.5 1-1.5 1.7-2.5 3-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    "Runecrafting": '<path d="M12 3 20 12 12 21 4 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8v8M8.5 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    "Farming": '<path d="M12 21v-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13c0-3.5-2.5-5.5-6-5.5.3 3.5 2.5 5.5 6 5.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 10c0-3 2.2-5 5.5-5-.2 3-2.2 5-5.5 5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    "Fishing": '<path d="M4 12c3-4 10-4 13 0-3 4-10 4-13 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M17 12l4-3v6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7.5" cy="11.3" r=".8" fill="currentColor" stroke="none"/>',
    "Agility": '<path d="M4 20c3 0 3-6 7-6s2 6 6 6 3-8 3-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="18" cy="6" r="1.4" fill="currentColor" stroke="none"/>'
  };
  function skillSvg(name){ return SKILL_ICONS[name] ? '<svg viewBox="0 0 24 24" aria-hidden="true">'+SKILL_ICONS[name]+'</svg>' : ""; }

  // ---------- build the unified, searchable entry list ----------
  var ENTRIES = [];

  (window.WILDS_SKILLS || []).forEach(function(s){
    ENTRIES.push({ kind:"skill", tab:"skills", id:"skill:"+s[0], name:s[0], cat:s[1], desc:s[2] });
  });

  (window.WILDS_QUESTS_PRIMARY || []).forEach(function(q, i){
    ENTRIES.push({ kind:"quest", tab:"quests", id:"quest:p:"+q[0], name:q[0], sub:"Primary #"+(i+1),
      type:"primary", order:i+1, desc:q[1] });
  });
  Object.keys(window.WILDS_QUESTS_SECONDARY || {}).forEach(function(region){
    window.WILDS_QUESTS_SECONDARY[region].forEach(function(name){
      ENTRIES.push({ kind:"quest", tab:"quests", id:"quest:s:"+name, name:name, sub:region,
        type:"secondary", region:region, desc:"Secondary quest, "+region+"." });
    });
  });

  // Storage items browse through the dedicated Items/Storage tab (grouped by
  // chest, see drawStorage()) but are also searchable individually here (tab
  // left blank so they don't show up as their own flat browsing list).
  (window.WILDS_STORAGE || []).forEach(function(cat){
    cat.items.forEach(function(it, i){
      ENTRIES.push({ kind:"storage-item", tab:"", id:"storitem:"+cat.key+":"+i, name:it.name,
        sub:it.tier||cat.label, img:it.img, note:it.note||"", chestLabel:cat.label, item:it });
    });
  });

  // ---------- search ----------
  function norm(s){ return (s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,""); }
  function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(Boolean); }
  function haystack(e){
    var parts = [e.name, e.sub, e.desc, e.blurb, e.features, e.req, e.cat, e.slot, e.style, e.note];
    if (e.areas) parts = parts.concat(e.areas);
    if (e.names) parts = parts.concat(e.names);
    return norm(parts.filter(Boolean).join(" "));
  }
  function score(e, toks){
    var hay = haystack(e), nm = norm(e.name), hit = 0;
    for (var i=0;i<toks.length;i++){
      if (hay.indexOf(toks[i]) === -1) return -1;
      hit += nm.indexOf(toks[i]) === 0 ? 3 : (nm.indexOf(toks[i]) !== -1 ? 2 : 1);
    }
    return hit;
  }
  function search(q){
    var toks = tokens(q);
    if (!toks.length) return [];
    var out = [];
    ENTRIES.forEach(function(e){
      var sc = score(e, toks);
      if (sc >= 0) out.push([sc, e]);
    });
    out.sort(function(a,b){ return b[0]-a[0]; });
    return out.slice(0, 60).map(function(p){ return p[1]; });
  }

  // ---------- persisted tracker state ----------
  var LS_KEY = "wilds-state-v1";
  var STATE = loadState();
  function defaultState(){
    return { skills:{}, quests:{}, code:"", powerFilterOn:false, powerLevel:0 };
  }
  function loadState(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch(e){ return defaultState(); }
  }
  function saveState(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch(e){}
    syncSoon();
  }
  function skillLevel(name){ return STATE.skills[name] || 1; }
  function setSkillLevel(name, v){ STATE.skills[name] = Math.max(1, Math.min(99, v)); saveState(); }

  // UI-only state: which tracker sub-panels are expanded. Not persisted - // rebuilt fresh each session, but must survive a drawTracker() re-render
  // triggered by clicking something *inside* an open panel.
  var openAreas = {};
  // Which of the Progress boxes (Skills/Quests) is currently expanded below
  // the grid, and which smaller sub-box inside that one (a skill category,
  // or a quest line) is expanded below its own sub-grid. One of each at a time.
  // Skills or Quests is always expanded on Progress - never both collapsed.
  var openBox = "skills";
  var openSub = null;
  // Which chest category is expanded in the Items/Storage tab.
  var openChest = null;
  // Which single item's full detail is expanded (scoped: "chest::Name" or
  // "station::Name" so the same item can be open independently in either view).
  var openItem = null;
  // "chest" (default, browse by material/category) or "station" (pick one or
  // more crafting stations and see everything makeable there, combined).
  var storageView = "station";
  var selectedStations = {};

  // ---------- view state ----------
  // Progress is the app's home now - there's no separate landing screen to
  // navigate away from and back to.
  var view = { tab: "tracker", q: "" };

  var $ = function(sel, root){ return (root||document).querySelector(sel); };
  var qInput = $("#q"), clearBtn = $("#clear"), resultsEl = $("#results"),
      countEl = $("#count"), trackerEl = $("#tracker"), tabbarEl = $("#tabbar"), gearBtn = $("#gearBtn");

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  }); }

  // ---------- bottom tab bar ----------
  function tabSvg(iconKey){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[iconKey]+'</svg>'; }
  function drawTabbar(){
    tabbarEl.innerHTML = TABS.map(function(t){
      return '<button data-tab="'+t.key+'" class="'+(view.tab===t.key ? "on":"")+'">'+tabSvg(t.key)+'<span>'+esc(t.label)+'</span></button>';
    }).join("");
  }
  function goTab(key){
    view.tab = key; view.q = ""; qInput.value = ""; clearBtn.classList.remove("on");
    window.scrollTo(0,0); draw();
  }
  tabbarEl.addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if (b) goTab(b.dataset.tab);
  });
  gearBtn.addEventListener("click", function(){ goTab("settings"); });

  // ---------- search box ----------
  qInput.addEventListener("input", function(){
    view.q = qInput.value;
    clearBtn.classList.toggle("on", !!view.q);
    draw();
  });
  clearBtn.addEventListener("click", function(){
    view.q = ""; qInput.value = ""; clearBtn.classList.remove("on"); qInput.focus(); draw();
  });

  // ---------- card rendering ----------
  function cardHeader(e, badge, icon){
    return '<button type="button" data-open="'+e.id+'">'+(badge||"")+(icon||"")+'<h2>'+esc(e.name)+'</h2>'+
      (e.sub ? '<span class="sub">'+esc(e.sub)+'</span>' : '')+'</button>';
  }
  function cardWrap(e, headerHtml, bodyHtml){
    return '<div class="card" data-id="'+e.id+'">'+headerHtml+'<div class="body" hidden><div class="rows">'+bodyHtml+'</div></div></div>';
  }
  function questWalkthroughHtml(name){
    var w = window.WILDS_QUEST_WALKTHROUGHS && window.WILDS_QUEST_WALKTHROUGHS[name];
    if (!w) return '';
    var html = '';
    if (w.requirements) html += '<div class="wide"><div class="fk">Requirements</div><div class="fv">'+esc(w.requirements)+'</div></div>';
    if (w.rewards) html += '<div class="wide"><div class="fk">Rewards</div><div class="fv">'+esc(w.rewards)+'</div></div>';
    if (w.steps && w.steps.length){
      html += '<div class="r block"><div class="fk">Walkthrough</div><ol class="steps">'+
        w.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ol></div>';
    } else if (w.stub){
      html += '<div class="note">Detailed walkthrough not yet documented for this quest.</div>';
    }
    return html;
  }

  function renderCard(e){
    if (e.kind === "skill"){
      var lvl = skillLevel(e.name);
      var body = '<div class="r"><div class="fk">'+esc(e.cat)+'</div><div class="fv">'+esc(e.desc)+'</div></div>'+
        '<div class="r block"><div class="fk">Unlocks by level (yours: '+lvl+')</div>'+unlockListHtml(e.name, lvl)+'</div>';
      return cardWrap(e, cardHeader(e, null, '<span class="card-icon">'+skillSvg(e.name)+'</span>'), body);
    }
    if (e.kind === "quest"){
      var badge = '<span class="tagline">'+(e.type==="primary"?"Primary":"Secondary")+'</span>';
      var qbody = '<div class="r"><div class="fv">'+esc(e.desc)+'</div></div>'+questWalkthroughHtml(e.name);
      return cardWrap(e, cardHeader(e, badge), qbody);
    }
    if (e.kind === "storage-item"){
      var icon = e.img ? '<span class="card-icon"><img src="'+esc(e.img)+'" alt="" loading="lazy"></span>' : null;
      var badge = '<span class="tagline">'+esc(e.chestLabel)+'</span>';
      return cardWrap(e, cardHeader(e, badge, icon), itemDetailHtml(e.item));
    }
    return "";
  }

  resultsEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-open]");
    if (!btn) return;
    var card = btn.closest(".card");
    var body = card.querySelector(".body");
    var open = card.classList.toggle("open");
    body.hidden = !open;
    if (open){ body.classList.remove("in"); void body.offsetWidth; body.classList.add("in"); }
  });

  // ---------- main draw ----------
  function draw(){
    drawTabbar();
    var q = view.q.trim();
    trackerEl.hidden = true;

    if (view.tab === "tracker" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawTracker();
      return;
    }
    if (view.tab === "settings" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawSettings();
      return;
    }
    if (view.tab === "storage" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawStorage();
      return;
    }
    if (view.tab === "videos" && !q){
      trackerEl.hidden = false;
      resultsEl.innerHTML = ""; countEl.textContent = "";
      drawVideos();
      refreshVideos();
      return;
    }

    var list, title;
    if (q){
      list = search(q);
      title = "Results";
    } else {
      list = ENTRIES.filter(function(e){ return e.tab === view.tab; });
      title = TAB_LABEL[view.tab];
    }

    var extras = "";

    if (!list.length && !extras){
      countEl.textContent = "";
      resultsEl.innerHTML = '<div class="empty"><b>Nothing here yet</b>Try a different search.</div>';
      return;
    }

    countEl.textContent = title ? (title + " · " + list.length) : "";
    var cards = list.map(renderCard).join("");
    resultsEl.innerHTML = extras + (q ? cards : '<div class="results-grid">'+cards+'</div>');
  }

  // Shared by the Skills reference card and the Progress tracker's expandable
  // row, so the two never drift out of sync with each other.
  function unlockListHtml(name, lvl){
    var list = (window.WILDS_LEVEL_UNLOCKS && window.WILDS_LEVEL_UNLOCKS[name]) || [];
    if (!list.length) return '<div class="note">No confirmed level unlocks documented for this skill yet.</div>';
    return '<div class="chk">'+list.map(function(u){
      var isAll = u.level === "All";
      var on = isAll || lvl >= u.level;
      var label = isAll ? "All levels" : ("Lv " + u.level);
      return '<div class="row'+(on?" on":"")+'"><div class="box">✓</div><div class="t"><b>'+label+'</b> '+esc(u.name)+
        (u.note ? '<span class="req">'+esc(u.note)+'</span>' : '')+'</div></div>';
    }).join("")+'</div>';
  }
  function unlockListWrap(name, lvl){
    return '<div data-unlock-list="'+esc(name)+'">'+unlockListHtml(name, lvl)+'</div>';
  }

  function skillsTotal(){
    var released = window.WILDS_SKILLS || [];
    var total = released.reduce(function(s,r){ return s + skillLevel(r[0]); }, 0);
    return { done: total, total: released.length * 99 };
  }
  function questsTotal(){
    var primary = window.WILDS_QUESTS_PRIMARY || [];
    var done = primary.filter(function(p){ return STATE.quests["p:"+p[0]]; }).length;
    var count = primary.length;
    var regions = window.WILDS_QUESTS_SECONDARY || {};
    Object.keys(regions).forEach(function(r){
      regions[r].forEach(function(n){ count++; if (STATE.quests["s:"+n]) done++; });
    });
    return { done: done, total: count };
  }

  // A small box within an already-open Skills/Quests box: one per skill
  // category, or one per quest line. Tapping it expands the actual list.
  function tkSubBox(key, label, stat, sub, pct){
    var open = openSub === key;
    return '<button type="button" class="tk-subbox'+(open?" open":"")+'" data-subbox="'+esc(key)+'">'+
      '<span class="tk-subbox-label">'+esc(label)+'</span>'+

  // ---------- tracker: skills ----------
  // Flat grid, one small box per skill - no category layer in between. Tap
  // a box to see that skill's description, stepper and level unlocks.
  var SKILL_DESC_OF = {};
  (window.WILDS_SKILLS || []).forEach(function(s){ SKILL_DESC_OF[s[0]] = s[2]; });
  function skillBox(s){
    var name = s[0];

  function skillDetail(name){
    var lvl = skillLevel(name);
    var desc = SKILL_DESC_OF[name];
    var stepper = '<div class="fdwrap"><div class="fd"><span class="fd-icon">'+skillSvg(name)+'</span>'+

      '<div class="stp"><button type="button" data-d="-1" data-skill="'+esc(name)+'" aria-label="Decrease">−</button><span class="v" data-skill-level="'+esc(name)+'">'+lvl+'</span><button type="button" data-d="1" data-skill="'+esc(name)+'" aria-label="Increase">+</button></div></div></div>';
    return (desc ? '<div class="r"><div class="fv">'+esc(desc)+'</div></div>' : '') + stepper + unlockListWrap(name, lvl);
  }
  function skillsBlock(){
    var released = window.WILDS_SKILLS || [];
    var openName = (openSub && openSub.indexOf("skill:") === 0) ? openSub.slice(6) : null;
    var html = released.map(function(s){
      var box = skillBox(s);
      if (openName && s[0] === openName){
        box += '<div class="tk-subpanel" data-skill-panel="'+esc(openName)+'"><h4>'+esc(openName)+'</h4>'+skillDetail(openName)+'</div>';
      }

  }
  function updateSkillTotal(){
    var sk = skillsTotal();
    var stat = document.getElementById("boxStatSkills");
    var bar = document.getElementById("boxBarSkills");
    if (stat) stat.textContent = sk.done + " / " + sk.total;
    if (bar){ bar.classList.toggle("done", sk.done >= sk.total); bar.querySelector("i").style.width = Math.round(sk.done / sk.total * 100) + "%"; }
  }

  // ---------- tracker: quests ----------
  function questRow(name, sub, keyPrefix){
    var key = keyPrefix + name;
    var on = !!STATE.quests[key];
    var open = !!openAreas["quest:"+key];
    return '<div class="row'+(on?" on":"")+'" data-qkey="'+esc(key)+'"><div class="box">✓</div><div class="t">'+esc(name)+(sub?'<span class="req">'+esc(sub)+'</span>':'')+'</div>'+
      '<button type="button" class="chevron-btn" data-toggle-quest="'+esc(key)+'" aria-label="Details">›</button></div>'+
      '<div class="quest-detail" data-quest-panel="'+esc(key)+'" '+(open?'':'hidden')+'>'+questWalkthroughHtml(name)+'</div>';
  }
  function questLines(){
    var lines = [{ key:"Primary", list:(window.WILDS_QUESTS_PRIMARY||[]).map(function(p){ return p[0]; }), prefix:"p:" }];
    var regions = window.WILDS_QUESTS_SECONDARY || {};
    Object.keys(regions).forEach(function(r){ lines.push({ key:r, list:regions[r], prefix:"s:" }); });
    return lines;
  }
  function questLineTotal(line){
    var done = line.list.filter(function(n){ return STATE.quests[line.prefix+n]; }).length;
    return { done: done, total: line.list.length };
  }
  function questsBlock(){
    var lines = questLines();
    var subGrid = '<div class="tk-subgrid">'+lines.map(function(line){
      var t = questLineTotal(line);
      return tkSubBox("questline:"+line.key, line.key, t.done+" / "+t.total, "Quests", Math.round(t.done/t.total*100));
    }).join("")+'</div>';
    var panel = "";
    if (openSub && openSub.indexOf("questline:") === 0){
      var key = openSub.slice(10);
      var line = lines.filter(function(l){ return l.key === key; })[0];
      if (line){
        var rows = line.list.map(function(n){ return questRow(n, "", line.prefix); }).join("");
        panel = '<div class="tk-subpanel"><h4>'+esc(key)+'</h4><div class="area open"><div class="body" style="padding-top:.6rem"><div class="chk">'+rows+'</div></div></div></div>';
      }
    }
    return subGrid + panel;
  }

  // ---------- tracker: sync + backup ----------
  var ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  function newCode(){
    function part(){ var s=""; for(var i=0;i<4;i++) s += ALPHA[Math.floor(Math.random()*ALPHA.length)]; return s; }
    return "WILDS-"+part()+"-"+part();
  }
  var syncMsg = "";
  function syncPayload(){ return { skills: STATE.skills, quests: STATE.quests }; }
  var syncTimer = null;
  function syncSoon(){
    if (!STATE.code) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncPush(true); }, 1200);
  }
  function syncPush(quiet){
    if (!STATE.code) return;
    fetch("/api/sync?code="+encodeURIComponent(STATE.code), {
      method: "PUT", headers: {"content-type":"application/json"}, body: JSON.stringify(syncPayload())
    }).then(function(r){ return r.json(); }).then(function(r){
      if (!quiet) { syncMsg = r.ok ? "Synced." : ("Sync failed: "+(r.error||"")); drawSettings(); }
    }).catch(function(){ if (!quiet){ syncMsg = "Sync failed - offline?"; drawSettings(); } });
  }
  function syncPull(){
    if (!STATE.code) return;
    fetch("/api/sync?code="+encodeURIComponent(STATE.code)).then(function(r){ return r.json(); }).then(function(r){
      if (r.error){ syncMsg = r.error === "not found" ? "No data saved under that code yet." : ("Pull failed: "+r.error); drawSettings(); return; }
      STATE.skills = r.skills||{}; STATE.quests = r.quests||{};
      saveState(); syncMsg = "Pulled latest."; drawSettings();
    }).catch(function(){ syncMsg = "Pull failed - offline?"; drawSettings(); });
  }

  var bkMsg = "", bkMsgCls = "";
  function backupJSON(){ return JSON.stringify({ skills: STATE.skills, quests: STATE.quests }, null, 2); }
  function restoreBackup(text){
    try {
      var p = JSON.parse(text);
      STATE.skills = p.skills||{}; STATE.quests = p.quests||{};
      saveState(); bkMsg = "Restored."; bkMsgCls = "ok";
    } catch(e){ bkMsg = "That's not valid backup JSON."; bkMsgCls = "bad"; }
    drawSettings();
  }

  function syncBlock(){
    var have = !!STATE.code;
    return '<div class="tk-section"><h3>Sync across devices</h3>'+
      '<div class="sy">'+(have ? '<b>'+esc(STATE.code)+'</b>' : '<span style="color:var(--text3);font-size:13px">No code yet</span>')+'</div>'+
      (have ?
        '<div class="bk"><button data-act="push">Push</button><button data-act="pull">Pull</button><button data-act="forget">Forget code</button></div>' :
        '<div class="bk"><button data-act="new">Create a code</button></div><input id="syIn" placeholder="Or enter an existing code">'+
        '<div class="bk"><button data-act="use">Use this code</button></div>'
      )+
      (syncMsg ? '<div id="bkMsg" class="ok">'+esc(syncMsg)+'</div>' : '')+
      '</div>';
  }
  function backupBlock(){
    return '<div class="tk-section"><h3>Backup</h3>'+
      '<div class="bk"><button data-act="export">Copy to box</button><button data-act="import">Restore from box</button></div>'+
      '<textarea id="bkBox" spellcheck="false"></textarea>'+
      (bkMsg ? '<div id="bkMsg" class="'+bkMsgCls+'">'+esc(bkMsg)+'</div>' : '')+
      '</div>';
  }

  function tkBox(key, label, stat, sub, pct, statId, barId){
    var open = openBox === key;
    return '<button type="button" class="tk-box'+(open?" open":"")+'" data-box="'+key+'">'+
      '<span class="tk-box-label">'+esc(label)+'</span>'+
      '<span class="tk-box-stat"'+(statId?' id="'+statId+'"':'')+'>'+esc(stat)+'</span>'+
      '<span class="tk-box-sub">'+esc(sub)+'</span>'+
      (pct!=null ? '<div class="bar'+(pct>=100?" done":"")+'"'+(barId?' id="'+barId+'"':'')+'><i style="width:'+pct+'%"></i></div>' : '')+
      '</button>';
  }
  function drawTracker(){
    var sk = skillsTotal(), qt = questsTotal();
    var grid = '<div class="tk-grid">'+
      tkBox("skills", "Skills", sk.done+" / "+sk.total, "Total level", Math.round(sk.done/sk.total*100), "boxStatSkills", "boxBarSkills")+
      tkBox("quests", "Quests", qt.done+" / "+qt.total, "Completed", Math.round(qt.done/qt.total*100))+
      '</div>';

    var panel = "";
    if (openBox === "skills") panel = '<div class="tk-panel"><h3>Skills</h3>'+skillsBlock()+'</div>';
    else if (openBox === "quests") panel = '<div class="tk-panel"><h3>Quests</h3>'+questsBlock()+'</div>';

    trackerEl.innerHTML = '<div class="tk-head"><h2>My progress</h2></div>'+grid+panel;
  }

  // ---------- items / storage ----------
  // Items past your current power level are hidden when the filter is on.
  // Untiered items (rare/unique drops) are pinned to the chest's top step by
  // build_storage.py, so they only appear once the filter reaches max.
  function visibleItems(cat){
    if (!STATE.powerFilterOn) return cat.items;
    return cat.items.filter(function(it){ return it.step <= STATE.powerLevel; });
  }
  function chestBox(cat){
    var open = openChest === cat.key;
    var shown = visibleItems(cat).length;
    return '<button type="button" class="tk-subbox'+(open?" open":"")+'" data-chest="'+esc(cat.key)+'">'+
      '<span class="tk-subbox-label">'+esc(cat.label)+'</span>'+
      '<span class="tk-subbox-stat">'+shown+(STATE.powerFilterOn && shown!==cat.items.length ? ' / '+cat.items.length : '')+'</span>'+
      '<span class="tk-subbox-sub">items</span>'+
      '</button>';
  }
  // A splash of color on the highest tiers so browsing a chest isn't just a
  // wall of gold text - dragon/ancestral materials glow ember, arcane ones
  // glow mystic, everyday bronze-to-rune stays the familiar gold.
  function tierHue(tier){
    if (!tier) return "";
    if (/dragon|fang|blood/i.test(tier)) return "tier-ember";
    if (/mystic|ancestral|master|astral|magic/i.test(tier)) return "tier-mystic";
    if (/^rune$|law|nature/i.test(tier)) return "tier-teal";
    return "";
  }
  function itemTile(it, scope){
    var img = it.img ? '<img src="'+esc(it.img)+'" alt="" loading="lazy">' : '<span class="item-tile-noimg">?</span>';
    var open = openItem === scope+"::"+it.name;
    return '<button type="button" class="item-tile'+(open?" open":"")+'" data-item="'+esc(scope+"::"+it.name)+'">'+
      '<div class="item-tile-img">'+img+'</div>'+
      '<div class="item-tile-name">'+esc(it.name)+'</div>'+
      (it.tier ? '<div class="item-tile-tier '+tierHue(it.tier)+'">'+esc(it.tier)+'</div>' : '')+
      '</button>';
  }
  // Every item's image, looked up by exact name, so recipe ingredients can
  // show their own icon too - built once, lazily, from the full item list.
  var ITEM_IMG_BY_NAME = null;
  function itemImgByName(name){
    if (!ITEM_IMG_BY_NAME){
      ITEM_IMG_BY_NAME = {};
      (window.WILDS_STORAGE || []).forEach(function(cat){
        cat.items.forEach(function(it){ if (it.img && !ITEM_IMG_BY_NAME[it.name]) ITEM_IMG_BY_NAME[it.name] = it.img; });
      });
    }
    return ITEM_IMG_BY_NAME[name] || "";
  }
  // "3x Swamp Thread, 4x Vault Shard" -> [{qty:"3",name:"Swamp Thread"}, ...]
  // Different wiki infobox fields separate multi-material lists differently:
  // "6x Bronze Bar, 3x Small Animal Fang, Wool Thread" (comma-separated, and
  // the wiki's own recipe template sometimes omits the quantity entirely for
  // a material - meaning 1 - rather than always writing "1x") from one
  // source, but "1 × Oak Logs 1 × Padded Cloth 1 × Warped Feathers" (bare
  // spaces, no commas at all) from the "Products" field's embedded Materials
  // sub-value. Split on commas first (the outer list separator when
  // present), then within each comma segment split further on quantity
  // markers ("N x"/"N ×") in case several materials were packed into one
  // segment with no commas at all.
  function splitByMarkers(value){
    var markerRe = /(\d+)\s*[x×]\s*/gi;
    var marks = [];
    var m;
    while ((m = markerRe.exec(value))) marks.push({ qty: m[1], markerStart: m.index, nameStart: markerRe.lastIndex });
    if (!marks.length){
      var bare = value.trim().replace(/^[x×]\s*/i, "");
      return bare ? [{ qty: "1", name: bare }] : [];
    }
    return marks.map(function(mk, i){
      var end = (i + 1 < marks.length) ? marks[i + 1].markerStart : value.length;
      var name = value.slice(mk.nameStart, end).replace(/[,;]+\s*$/, "").trim();
      return { qty: mk.qty, name: name };
    }).filter(function(m){ return m.name; });
  }
  function parseMaterials(value){
    var out = [];
    value.split(",").forEach(function(seg){
      out = out.concat(splitByMarkers(seg));
    });
    return out;
  }
  function materialChip(m){
    var img = itemImgByName(m.name);
    return '<div class="mat-chip">'+
      (img ? '<img src="'+esc(img)+'" alt="" loading="lazy">' : '<span class="item-tile-noimg">?</span>')+
      '<span class="mat-chip-text">'+(m.qty ? '<b>'+esc(m.qty)+'×</b> ' : '')+esc(m.name)+'</span>'+
      '</div>';
  }
  // Full wiki detail for one item, reorganized so the stuff you actually
  // scan for - what it's made from, its stats - is up top in a compact
  // grid, and the prose lore/description (the long part) sits at the
  // bottom instead of pushing everything else off-screen.
  // Raw materials describe their recipe differently: a combined "Products"
  // field like "Product: 1 x Leather; Facility: Tannery; XP: 20; Materials:
  // 1 x Animal Hide" (possibly several, joined by " || " for multi-recipe
  // items) instead of separate Recipe/Crafting Station rows.
  function renderProductsField(value){
    return value.split("||").map(function(line){
      var parts = {};
      line.split(";").forEach(function(seg){
        var i = seg.indexOf(":");
        if (i < 0) return;
        parts[seg.slice(0, i).trim().toLowerCase()] = seg.slice(i + 1).trim();
      });
      var out = "";
      if (parts.product) out += '<span class="fk">Makes</span><span class="fv"> '+esc(parts.product)+'</span>';
      if (parts.materials) out += '<div class="mat-chips">'+parseMaterials(parts.materials).map(materialChip).join("")+'</div>';
      if (parts.xp) out += '<div style="margin-top:.2rem"><span class="fk">XP</span><span class="fv"> '+esc(parts.xp)+'</span></div>';
      return '<div class="wide">'+out+'</div>';
    }).join("");
  }
  // Some materials (mostly the textile/leather research pass) describe their
  // recipe as a flattened wiki table instead of the "Products" semicolon
  // format above: "Facility | Loom || Skill | Experience || Artisan | 40 ||
  // Material | Quantity || Desert Thread | 3 || Cactus Fibres | 3 || Output |
  // Quantity || Desert Cloth | 1" - pipe-separated key/value cells, "||"
  // separated rows, with header cells ("Material | Quantity") marking the
  // start of a run of data rows that follow until the next header. No colons
  // at all, which is how we tell it apart from the "Products" field.
  function isPipeTableRecipe(value){
    return value.indexOf("|") !== -1 && !/:\s/.test(value);
  }
  function renderRecipeTableField(value, label){
    var materials = [], outputs = [], skillLine = "", mode = null;
    value.split("||").forEach(function(seg){
      var parts = seg.split("|").map(function(p){ return p.trim(); });
      if (parts.length < 2) return;
      var key = parts[0], val = parts[1];
      if (/^facility$/i.test(key)) { mode = null; return; }
      if (/^skill$/i.test(key) && /^experience$/i.test(val)) { mode = "skill"; return; }
      if (/^material$/i.test(key) && /^quantity$/i.test(val)) { mode = "material"; return; }
      if (/^output$/i.test(key) && /^quantity$/i.test(val)) { mode = "output"; return; }
      if (mode === "skill") { skillLine = key + " " + val + " XP"; return; }
      if (mode === "material") { materials.push({ qty: val, name: key }); return; }
      if (mode === "output") { outputs.push({ qty: val, name: key }); return; }
    });
    var variant = label.match(/\(([^)]+)\)/);
    var out = variant ? '<div><span class="fk">'+esc(variant[1])+'</span></div>' : "";
    if (outputs.length) out += '<span class="fk">Makes</span><span class="fv"> '+esc(outputs.map(function(o){ return o.qty+"× "+o.name; }).join(", "))+'</span>';
    if (materials.length) out += '<div class="mat-chips">'+materials.map(materialChip).join("")+'</div>';
    if (skillLine) out += '<div style="margin-top:.2rem"><span class="fk">XP</span><span class="fv"> '+esc(skillLine)+'</span></div>';
    return '<div class="wide">'+out+'</div>';
  }
  // Basic food items write their recipe as a plain sentence instead of
  // either table format: "1 x Rat Roast + 1 x Baked Potato + 1 x Fried Egg
  // -> 1 x Cheeky Fryup (Cooking 20 XP)", with the facility named in the
  // label's own parenthetical (already surfaced via "Made at" above) and
  // sometimes a second parenthetical after it for a material variant, e.g.
  // "Recipe (Campfire - Raw egg)".
  function isArrowRecipe(value){
    return value.indexOf("→") !== -1;
  }
  function renderArrowRecipeField(value, label){
    var parts = value.split("→");
    if (parts.length < 2) return '<div class="wide"><span class="fv">'+esc(value)+'</span></div>';
    var materials = parts[0].split("+").map(function(s){ return splitByMarkers(s)[0]; }).filter(Boolean);
    var outMatch = parts[1].match(/^\s*(.*?)\s*(?:\(([^)]+)\))?\s*$/);
    var outputs = outMatch ? splitByMarkers(outMatch[1]) : [];
    var skillLine = outMatch && outMatch[2] ? outMatch[2] : "";
    var variant = label.match(/\(([^)]+)\)/);
    var sub = variant ? variant[1].split(/\s*[-—]\s*/)[1] : "";
    var out = sub ? '<div><span class="fk">'+esc(sub)+'</span></div>' : "";
    if (outputs.length) out += '<span class="fk">Makes</span><span class="fv"> '+esc(outputs.map(function(o){ return o.qty+"× "+o.name; }).join(", "))+'</span>';
    if (materials.length) out += '<div class="mat-chips">'+materials.map(materialChip).join("")+'</div>';
    if (skillLine) out += '<div style="margin-top:.2rem"><span class="fk">XP</span><span class="fv"> '+esc(skillLine)+'</span></div>';
    return '<div class="wide">'+out+'</div>';
  }
  // "Source: Deer; Quantity: 1; Rarity: Always || Source: Cow; ..." -> one
  // clean line per source instead of a semicolon-and-pipe wall of text.
  function renderSourcesField(value){
    return value.split("||").map(function(line){
      var parts = {};
      line.split(";").forEach(function(seg){
        var i = seg.indexOf(":");
        if (i < 0) return;
        parts[seg.slice(0, i).trim().toLowerCase()] = seg.slice(i + 1).trim();
      });
      var bits = [parts.source, parts.quantity, parts.rarity].filter(Boolean);
      return '<div class="wide"><span class="fv">'+esc(bits.join(" - "))+'</span></div>';
    }).join("");
  }
  function itemDetailHtml(it){
    var d = it.detail;
    var infobox = (d && d.infobox) || [];
    var recipeRows = [], sourceRows = [], statRows = [];
    infobox.forEach(function(r){
      if (/^Crafting (Station|Facility)/i.test(r.label)) return; // redundant with "Made at" below
      if (/item sources?/i.test(r.label)) return sourceRows.push(r);
      (/recipe|product/i.test(r.label) ? recipeRows : statRows).push(r);
    });

    var recipeHtml = "";
    if ((it.stations && it.stations.length) || recipeRows.length){
      var inner = (it.stations && it.stations.length)
        ? '<div class="wide"><span class="fk">Made at</span><span class="fv"> '+esc(it.stations.join(", "))+'</span></div>' : "";
      inner += recipeRows.map(function(r){
        if (/product/i.test(r.label)){
          // Raw materials like Gold Bar or Dragonstone feed 15-30+ unrelated
          // recipes. Rendering every one of those as a full block turns the
          // item's own page into a wall of noise, so past a point we show a
          // one-line summary instead and point at crafting-station browsing.
          var lines = r.value.split("||");
          if (lines.length > 6){
            var facilities = [];
            lines.forEach(function(line){
              var fm = line.match(/Facility:\s*([^;]+)/i);
              if (fm){ var f = fm[1].trim(); if (f && facilities.indexOf(f) === -1) facilities.push(f); }
            });
            return '<div class="wide"><span class="fv">Used in '+lines.length+' different recipes'+
              (facilities.length ? ' across '+facilities.length+' crafting stations ('+esc(facilities.join(", "))+')' : '')+
              '. Browse by crafting station to see them all.</span></div>';
          }
          return renderProductsField(r.value);
        }
        if (isArrowRecipe(r.value)) return renderArrowRecipeField(r.value, r.label);
        if (isPipeTableRecipe(r.value)) return renderRecipeTableField(r.value, r.label);
        if (/material/i.test(r.label)){
          return '<div class="wide"><span class="fk">'+esc(r.label)+'</span><div class="mat-chips">'+parseMaterials(r.value).map(materialChip).join("")+'</div></div>';
        }
        return '<div class="wide"><span class="fk">'+esc(r.label)+'</span><span class="fv"> '+esc(r.value)+'</span></div>';
      }).join("");
      recipeHtml = '<div class="r block"><div class="fk subhead">Recipe</div>'+inner+'</div>';
    }

    var statsHtml = statRows.length
      ? '<div class="r block"><div class="fk subhead">Stats</div><div class="stat-grid">'+statRows.map(function(r){
          return '<div class="stat-chip"><span class="fk">'+esc(r.label)+'</span><span class="fv">'+esc(r.value)+'</span></div>';
        }).join("")+'</div></div>'
      : "";

    var sourcesHtml = sourceRows.length
      ? '<div class="r block"><div class="fk subhead">Found from</div>'+sourceRows.map(function(r){ return renderSourcesField(r.value); }).join("")+'</div>'
      : "";

    var descText = (d && d.description) ? d.description : it.note;
    var descHtml = descText ? '<div class="r"><div class="fk subhead">About</div><div class="fv item-detail-desc">'+esc(descText)+'</div></div>' : "";

    if (!recipeHtml && !sourcesHtml && !statsHtml && !descHtml) return '<div class="note">No extra detail yet - still being researched.</div>';
    return recipeHtml + sourcesHtml + statsHtml + descHtml;
  }
  function itemGridHtml(items, scope){
    if (!items.length) return "";
    return '<div class="item-grid">'+items.map(function(it){
      var tile = itemTile(it, scope);
      if (openItem === scope+"::"+it.name){
        tile += '<div class="item-detail"><h5>'+esc(it.name)+(it.tier ? ' <span class="item-tile-tier '+tierHue(it.tier)+'">'+esc(it.tier)+'</span>' : '')+'</h5>'+itemDetailHtml(it)+'</div>';
      }
      return tile;
    }).join("")+'</div>';
  }
  function storageBlock(){
    var cats = window.WILDS_STORAGE || [];
    var html = cats.map(function(cat){
      var box = chestBox(cat);
      if (openChest === cat.key){
        var shown = visibleItems(cat);
        var tiles = shown.length
          ? itemGridHtml(shown, "chest:"+cat.key)
          : '<div class="note">'+(cat.items.length ? "Nothing at your current power level yet." : "Nothing catalogued here yet.")+'</div>';
        box += '<div class="tk-subpanel"><h4>'+esc(cat.label)+'</h4>'+tiles+'</div>';
      }
      return box;
    }).join("");
    return '<div class="tk-subgrid">'+html+'</div>';
  }
  // ---------- items / by crafting station ----------
  function stationBox(st){
    var on = !!selectedStations[st.name];
    return '<button type="button" class="tk-subbox'+(on?" open":"")+'" data-station="'+esc(st.name)+'">'+
      '<span class="tk-subbox-label">'+esc(st.name)+'</span>'+
      '<span class="tk-subbox-stat">'+st.count+'</span>'+
      '<span class="tk-subbox-sub">items</span>'+
      '</button>';
  }
  // A selected station name may be a merged group (e.g. "Tannery" standing
  // in for both Tannery and Advanced Tannery) - expand to every real
  // station tag it covers before matching against items.
  function selectedStationMembers(selected){
    var all = window.WILDS_STATIONS || [];
    var members = {};
    Object.keys(selected).forEach(function(name){
      if (!selected[name]) return;
      var st = all.filter(function(s){ return s.name === name; })[0];
      (st && st.members ? st.members : [name]).forEach(function(m){ members[m] = true; });
    });
    return members;
  }
  function itemsAtStations(selected){
    var members = selectedStationMembers(selected);
    var out = [];
    (window.WILDS_STORAGE || []).forEach(function(cat){
      cat.items.forEach(function(it){
        if (!it.stations || !it.stations.some(function(s){ return members[s]; })) return;
        if (STATE.powerFilterOn && it.step > STATE.powerLevel) return;
        out.push(it);
      });
    });
    out.sort(function(a,b){ return a.name.localeCompare(b.name); });
    return out;
  }
  function stationBlock(){
    var stations = window.WILDS_STATIONS || [];
    var names = Object.keys(selectedStations).filter(function(k){ return selectedStations[k]; });
    var grid = '<div class="tk-subgrid">'+stations.map(stationBox).join("")+'</div>';
    if (!stations.length) return grid + '<div class="note">Crafting stations aren’t catalogued yet - still being researched.</div>';
    if (!names.length) return grid;
    var items = itemsAtStations(selectedStations);
    return grid + '<div class="tk-panel" style="margin-top:.8rem"><h3>Made at '+esc(names.join(" + "))+' ('+items.length+')</h3>'+
      (items.length ? itemGridHtml(items, "station") : '<div class="note">Nothing at your current power level yet.</div>')+'</div>';
  }
  function storageTabs(){
    return '<div class="view-tabs">'+
      '<button type="button" class="view-tab'+(storageView==="station"?" on":"")+'" data-view="station">By crafting station</button>'+
      '<button type="button" class="view-tab'+(storageView==="chest"?" on":"")+'" data-view="chest">By material</button>'+
      '</div>';
  }
  function powerControl(){
    var max = window.WILDS_STORAGE_MAX_STEP || 0;
    return '<div class="power-ctl">'+
      '<label class="power-toggle"><input type="checkbox" id="powerFilterOn"'+(STATE.powerFilterOn?' checked':'')+'><span>Only show my power level</span></label>'+
      (STATE.powerFilterOn ? '<div class="power-stp"><button type="button" data-pwr="-1" aria-label="Decrease">−</button><span>Level '+(STATE.powerLevel+1)+' of '+(max+1)+'</span><button type="button" data-pwr="1" aria-label="Increase">+</button></div>' : '')+
      '</div>';
  }
  function drawStorage(){
    var cats = window.WILDS_STORAGE || [];
    var total = cats.reduce(function(s,c){ return s + c.items.length; }, 0);
    trackerEl.innerHTML = '<div class="tk-head"><h2>Items</h2><p class="tk-head-note">'+total+' items, sorted lowest to highest quality. Tap one to see everything the wiki has on it.</p></div>'+
      storageTabs() + powerControl() +
      (storageView === "station" ? stationBlock() : storageBlock());
  }
  // ---------- videos ----------
  // Fallback only - used if the live /api/latest-videos fetch fails (e.g.
  // testing locally without Netlify Functions, or offline). Whenever that
  // fetch succeeds, videoState.ids is replaced with the real current list.
  var VIDEO_CHANNEL = {
    name: "Primitive Nomad",
    url: "https://www.youtube.com/@primitivenomad",
    channelId: "UCRbqswsX9bDjWrQ2jxyVD3w",
    fallback25: ["Gq03JgW3CZc","7FrGPpb2Vvo","qWguVYuxrqo","DOXQjNytftE","vma5KmAqtF8",
      "SgHrBkJJXHE","yLOAZNShmSU","TQRmB724Slc","bunuQfikXe8","gtqJNUOkIoQ",
      "oEzRyEebcLM","ti_8zKAjO5g","3oCXdp2lLA8","0_KiVr0mSa0","9uPt0wAU2Wg",
      "aBLhJcpsnD8","LNciYSOYddI","CWkDYIq_XkM","A0dRzp4rkD8","3hHfGxhOb-Q",
      "xDCuEOunnuk","odV1jVa65mU","HaHFmb88830","pmvC7r7_Y8Q","7PqWMTQJHKM"]
  };
  var videoState = { ids: VIDEO_CHANNEL.fallback25, selected: null, loading: false, stale: true, error: "" };
  function videoEmbedSrc(id){
    return "https://www.youtube.com/embed/"+id;
  }
  function videoThumbHtml(id, active){
    return '<button type="button" class="video-thumb'+(active?" active":"")+'" data-vid="'+esc(id)+'">'+
      '<img src="https://i.ytimg.com/vi/'+esc(id)+'/mqdefault.jpg" alt="" loading="lazy"></button>';
  }
  function drawVideos(){
    var note = videoState.stale
      ? "Showing a saved list - fetching the current 25 latest…"
      : "The 25 latest uploads from "+VIDEO_CHANNEL.name+", refreshed live.";
    if (videoState.error) note = "Couldn’t refresh just now (" + videoState.error + ") - showing the last known list.";
    var selectedId = videoState.selected || videoState.ids[0];
    trackerEl.innerHTML = '<div class="tk-head"><h2>Videos</h2><p class="tk-head-note">'+esc(note)+'</p></div>'+
      '<div class="power-ctl"><button type="button" class="view-tab" id="videoRefreshBtn"'+(videoState.loading?' disabled':'')+'>'+(videoState.loading?"Refreshing…":"Refresh latest videos")+'</button></div>'+
      '<div class="video-embed"><iframe src="'+esc(videoEmbedSrc(selectedId))+'" '+
      'title="'+esc(VIDEO_CHANNEL.name)+'" frameborder="0" '+
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" '+
      'allowfullscreen loading="lazy"></iframe></div>'+
      '<div class="video-grid">'+videoState.ids.map(function(id){ return videoThumbHtml(id, id === selectedId); }).join('')+'</div>'+
      '<a class="video-channel-link" href="'+esc(VIDEO_CHANNEL.url)+'" target="_blank" rel="noopener">Open '+esc(VIDEO_CHANNEL.name)+' on YouTube ↗</a>';
    var btn = document.getElementById("videoRefreshBtn");
    if (btn) btn.addEventListener("click", function(){ refreshVideos(); });
  }
  function refreshVideos(){
    videoState.loading = true;
    if (view.tab === "videos") drawVideos();
    fetch("/api/latest-videos?channelId="+VIDEO_CHANNEL.channelId+"&count=25")
      .then(function(r){ return r.json(); })
      .then(function(data){
        videoState.loading = false;
        if (data && data.ids && data.ids.length){
          videoState.ids = data.ids; videoState.selected = null; videoState.stale = false; videoState.error = "";
        } else {
          videoState.error = (data && data.error) || "empty response";
        }
        if (view.tab === "videos") drawVideos();
      })
      .catch(function(){
        videoState.loading = false;
        videoState.error = "offline?";
        if (view.tab === "videos") drawVideos();
      });
  }
  function drawSettings(){
    trackerEl.innerHTML = '<div class="tk-head"><h2>Settings</h2></div>'+
      '<div class="tk-panel">'+syncBlock()+backupBlock()+'<button class="tk-reset" id="tkReset">Reset all progress</button></div>';
    var box = document.getElementById("bkBox");
    if (box) box.value = backupJSON();
  }

  trackerEl.addEventListener("change", function(e){
    if (e.target.id === "powerFilterOn"){
      STATE.powerFilterOn = e.target.checked;
      saveState();
      drawStorage();
    }
  });

  trackerEl.addEventListener("click", function(e){
    var viewBtn = e.target.closest("button[data-view]");
    if (viewBtn){
      storageView = viewBtn.dataset.view;
      openItem = null;
      drawStorage();
      return;
    }
    var chestBtn = e.target.closest("button[data-chest]");
    if (chestBtn){
      var ckey = chestBtn.dataset.chest;
      openChest = (openChest === ckey) ? null : ckey;
      openItem = null;
      drawStorage();
      return;
    }
    var stationBtn = e.target.closest("button[data-station]");
    if (stationBtn){
      var sname = stationBtn.dataset.station;
      selectedStations[sname] = !selectedStations[sname];
      openItem = null;
      drawStorage();
      return;
    }
    var itemBtn = e.target.closest("button[data-item]");
    if (itemBtn){
      var ikey = itemBtn.dataset.item;
      openItem = (openItem === ikey) ? null : ikey;
      drawStorage();
      return;
    }
    var vidBtn = e.target.closest("button[data-vid]");
    if (vidBtn){
      videoState.selected = vidBtn.dataset.vid;
      drawVideos();
      return;
    }
    var pwrBtn = e.target.closest("button[data-pwr]");
    if (pwrBtn){
      var max = window.WILDS_STORAGE_MAX_STEP || 0;
      var d = parseInt(pwrBtn.dataset.pwr, 10);
      STATE.powerLevel = Math.max(0, Math.min(max, STATE.powerLevel + d));
      saveState();
      drawStorage();
      return;
    }
    var boxBtn = e.target.closest("button[data-box]");
    if (boxBtn){
      var bkey = boxBtn.dataset.box;
      if (openBox === bkey) return; // one of Skills/Quests is always open
      openBox = bkey;
      openSub = null;
      drawTracker();
      return;
    }
    var subBtn = e.target.closest("button[data-subbox]");
    if (subBtn){
      var skey = subBtn.dataset.subbox;
      openSub = (openSub === skey) ? null : skey;
      drawTracker();
      return;
    }
    var stp = e.target.closest("button[data-d]");
    if (stp){
      var name = stp.dataset.skill;
      var d = parseInt(stp.dataset.d, 10);
      setSkillLevel(name, skillLevel(name) + d);
      var newLvl = skillLevel(name);
      document.querySelectorAll('[data-skill-level="'+name+'"]').forEach(function(el){
        el.textContent = el.classList.contains("tk-subbox-stat") ? ("Lv " + newLvl) : String(newLvl);
      });
      var v = stp.parentElement.querySelector("[data-skill-level]");
      if (v){
        v.classList.remove("tick-up", "tick-down");
        void v.offsetWidth; // restart the animation even on repeated same-direction taps
        v.classList.add(d > 0 ? "tick-up" : "tick-down");
      }
      updateSkillTotal();
      var wrap = document.querySelector('[data-unlock-list="'+name+'"]');
      if (wrap) wrap.outerHTML = unlockListWrap(name, newLvl);
      return;
    }
    var toggleQuest = e.target.closest("button[data-toggle-quest]");
    if (toggleQuest){
      var qkey = toggleQuest.dataset.toggleQuest;
      var qk = "quest:" + qkey;
      openAreas[qk] = !openAreas[qk];
      var qpanel = document.querySelector('[data-quest-panel="'+qkey+'"]');
      if (qpanel) qpanel.hidden = !openAreas[qk];
      toggleQuest.classList.toggle("open", openAreas[qk]);
      return;
    }
    var qrow = e.target.closest(".row[data-qkey]");
    if (qrow){
      var key = qrow.dataset.qkey;
      if (STATE.quests[key]) delete STATE.quests[key]; else STATE.quests[key] = true;
      saveState(); drawTracker(); return;
    }
    var act = e.target.closest("button[data-act]");
    if (act){
      var a = act.dataset.act;
      if (a === "new"){ STATE.code = newCode(); saveState(); syncMsg=""; syncPush(true); drawSettings(); }
      else if (a === "use"){
        var input = document.getElementById("syIn");
        var v = (input.value||"").toUpperCase().trim();
        if (/^WILDS-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){ STATE.code = v; saveState(); syncPull(); }
        else { syncMsg = "That doesn't look like a WILDS-XXXX-XXXX code."; drawSettings(); }
      }
      else if (a === "forget"){ STATE.code = ""; saveState(); syncMsg=""; drawSettings(); }
      else if (a === "push"){ syncPush(false); }
      else if (a === "pull"){ syncPull(); }
      else if (a === "export"){
        var box = document.getElementById("bkBox");
        box.value = backupJSON();
        var done = function(ok){ bkMsg = ok ? "Copied." : "Select and copy the text above."; bkMsgCls = ok?"ok":""; drawSettings(); };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(box.value).then(function(){done(true)}).catch(function(){
            box.select(); try{ done(document.execCommand("copy")); } catch(e){ done(false); }
          });
        } else {
          box.select(); try{ done(document.execCommand("copy")); } catch(e){ done(false); }
        }
      }
      else if (a === "import"){
        restoreBackup(document.getElementById("bkBox").value);
      }
      return;
    }
    if (e.target.id === "tkReset"){
      if (confirm("Clear all skill levels, quest checks, and your sync code? This can't be undone locally.")){
        STATE = defaultState(); saveState(); drawSettings();
      }
    }
  });

  draw();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
